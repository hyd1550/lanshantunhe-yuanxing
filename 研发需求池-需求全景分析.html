<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>研发需求池 · 需求全景分析</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f2f6fb;--bg3:#eef1f5;--border:#e4e8ee;--border2:#cfd6e0;
 --text:#1d2129;--text2:#5b6472;--text3:#98a1af;--blue:#2E7FE8;--blue-d:#1B62C4}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
.app{width:1660px;height:950px;display:flex;flex-direction:column;overflow:hidden;position:relative;
 background:linear-gradient(160deg,#eef4fb 0%,#f5f9fd 45%,#eaf1f9 100%)}

.tools{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:14px 22px 12px}
.tool-box{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);
 border-radius:6px;padding:7px 12px}
.lb{font-size:12.5px;color:var(--text2)}
.fsel{height:28px;padding:0 8px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);
 font-family:inherit;font-size:12.5px;outline:none;cursor:pointer;min-width:120px}

.body{flex:1;overflow:hidden;padding:0 22px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:14px;height:100%}
.card{background:var(--bg);border-radius:6px;box-shadow:0 1px 4px rgba(46,127,232,.06);display:flex;flex-direction:column;overflow:hidden}
.card-hd{display:flex;align-items:center;gap:8px;padding:12px 16px 10px}
.card-hd .bar{width:3px;height:14px;background:var(--blue);border-radius:1px}
.card-hd .n{font-size:14px;font-weight:600}
.card-hd .sp{flex:1}
.card-hd .hint{font-size:11px;color:var(--text3)}
.card-bd{flex:1;padding:0 16px 14px;min-height:0;position:relative}
.card-bd.col{display:flex;flex-direction:column}
.card-bd.col > svg{flex:1;min-height:0}

/* 高价值需求表 */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:11px 10px;text-align:center;border:none;border-bottom:1px solid #F0F4F9}
table.t td.nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
.hvft{flex-shrink:0;display:flex;align-items:center;gap:5px;padding-top:9px;font-size:12px}
.hvft .info{color:var(--text3);margin-right:auto}
table.t thead th{background:#F8FAFD;color:var(--text2);font-weight:600;font-size:12.5px;border-bottom:1px solid #DFE8F2;position:sticky;top:0;z-index:1}
table.t tbody tr:last-child td{border-bottom:none}
table.t tbody tr{transition:background .1s}
table.t td.l{text-align:left;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.t tbody tr:hover{background:#F5FAFF}
.tw{height:100%;overflow-y:auto}

/* 图例 */
.dlg{flex-shrink:0;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding-top:4px}
.dlg .i{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.dlg .sw{width:11px;height:11px;border-radius:2px;flex-shrink:0}

.tip{position:absolute;pointer-events:none;background:rgba(29,33,41,.94);color:#fff;border-radius:6px;
 padding:8px 11px;font-size:12px;line-height:1.7;opacity:0;transition:opacity .12s;z-index:30;white-space:nowrap}
.tip.show{opacity:1}
.tip b{font-size:12.5px}
.tip .r{display:flex;gap:14px;justify-content:space-between}
.tip .k{color:#9fb4cc}
.mask{position:absolute;inset:0;background:rgba(29,33,41,.4);display:none;align-items:center;justify-content:center;z-index:60}
.mask.show{display:flex}
.mod{width:1268px;max-height:660px;background:var(--bg);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.mod-hd{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border)}
.mod-hd .bar{width:3px;height:15px;background:var(--blue);border-radius:1px}
.mod-hd .t{font-size:14.5px;font-weight:600}
.mod-hd .cond{font-size:12px;color:var(--blue-d);background:#EAF3FE;border-radius:99px;padding:3px 11px}
.mod-hd .c{font-size:12.5px;color:var(--text3);margin-left:auto;margin-right:12px}
.mod-hd .x{cursor:pointer;color:var(--text3);font-size:19px;line-height:1}
.mod-hd .x:hover{color:var(--text)}
.mod-bd{flex:1;overflow-y:auto;padding:0 20px}
.mod-ft{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:11px 20px;border-top:1px solid var(--border);font-size:12.5px}
.mod-ft .info{color:var(--text3);margin-right:auto}
.pg{min-width:24px;height:24px;padding:0 6px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;
 border:1px solid var(--border2);border-radius:4px;background:var(--bg);cursor:pointer}
.pg:hover{border-color:var(--blue);color:var(--blue)}
.pg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg.dis{color:var(--text3);cursor:default;background:#fafbfc}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th,table.dt td{padding:10px 10px;border-bottom:1px solid #EDF2F8;text-align:center;white-space:nowrap}
table.dt thead th{background:#F7FAFE;color:var(--text2);font-weight:600;position:sticky;top:0;z-index:1}
table.dt td.l{text-align:left;white-space:normal;min-width:230px}
table.dt tbody tr:hover{background:#F8FBFF}
.act{color:var(--blue-d);cursor:pointer;font-size:12.5px}
.act:hover{text-decoration:underline}
.tg{font-size:11px;padding:1px 8px;border-radius:99px}
.tg-h{background:#FDECEA;color:#C0392B}
.tg-m{background:#FDF2DE;color:#8A5A0B}
.tg-l{background:#EEF1F5;color:#98a1af}
.st{font-size:11px;padding:1px 8px;border-radius:99px}
.st-1{background:#EAF2FE;color:#1B62C4}
.st-2{background:#E6F6EE;color:#0F7B4A}
.st-3{background:#FDF2DE;color:#8A5A0B}
.st-4{background:#EEF1F5;color:#98a1af}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;
 padding:9px 17px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style></head><body>
<div class="app">
  <div class="tools">
    <div class="tool-box">
      <span class="lb">时间范围:</span>
      <select class="fsel" id="rng" onchange="render()">
        <option value="12">近1年</option>
        <option value="6">近半年</option>
        <option value="3">近3个月</option>
      </select>
    </div>
  </div>

  <div class="body"><div class="grid2">
    <!-- 左上：气泡图 -->
    <div class="card">
      <div class="card-hd"><span class="bar"></span><span class="n">产品需求热度分析</span>
        <span class="sp"></span>
        <span class="hint">按产品统计 · 横轴 需求价值 · 纵轴 市场紧急度 · 气泡大小 提及次数 · 点击查看明细</span></div>
      <div class="card-bd">
        <svg id="mx" width="100%" height="100%" viewBox="0 0 760 400" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="tip" id="tip"></div>
      </div>
    </div>

    <!-- 右上：高价值需求 -->
    <div class="card">
      <div class="card-hd"><span class="bar"></span><span class="n">高优先级需求</span><span class="sp"></span><span class="hint">价值或紧急度含「高」，按综合优先级排序</span></div>
      <div class="card-bd col"><div class="tw" style="flex:1">
        <table class="t"><thead><tr>
          <th style="width:48px">序号</th><th>需求标题</th><th style="width:128px">关联产品</th>
          <th style="width:66px">价值</th><th style="width:76px">紧急度</th>
          <th style="width:94px">提报时间</th><th style="width:56px">操作</th>
        </tr></thead><tbody id="hvBody"></tbody></table>
      </div><div class="hvft"><span class="info" id="hvInfo"></span><span id="hvPager"></span></div></div>
    </div>

    <!-- 左下：需求类型分布 -->
    <div class="card">
      <div class="card-hd"><span class="bar"></span><span class="n">需求类型分布</span></div>
      <div class="card-bd col">
        <svg id="donut" width="100%" height="100%" viewBox="0 0 560 230" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="dlg" id="donutLg"></div>
      </div>
    </div>

    <!-- 右下：需求来源分布 -->
    <div class="card">
      <div class="card-hd"><span class="bar"></span><span class="n">需求来源分布</span></div>
      <div class="card-bd">
        <svg id="srcChart" width="100%" height="100%" viewBox="0 0 700 280" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>
  </div></div>

  <div class="mask" id="mask" onclick="if(event.target.id==='mask')closeM()"><div class="mod">
    <div class="mod-hd"><span class="bar"></span><span class="t">需求明细</span>
      <span class="cond" id="mCond"></span>
      <span class="c" id="mCnt"></span><span class="x" onclick="closeM()">×</span></div>
    <div class="mod-bd"><table class="dt">
      <thead><tr><th style="width:56px">序号</th><th>需求标题</th><th style="width:150px">关联产品</th>
        <th style="width:104px">需求类型</th><th style="width:74px">价值</th><th style="width:84px">紧急度</th>
        <th style="width:110px">需求来源</th><th style="width:80px">提报人</th>
        <th style="width:104px">提报时间</th><th style="width:96px">状态</th><th style="width:72px">操作</th></tr></thead>
      <tbody id="mBody"></tbody></table></div>
    <div class="mod-ft"><span class="info" id="mInfo"></span><span id="mPager"></span></div>
  </div></div>

  <div class="toast" id="toast"></div>
</div>
<script>
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ════ 需求主题 ════
   [名称, 价值评级分布[低,中,高], 紧急度评级分布[低,中,高], 颜色]
   坐标=各次评级加权均值（低1 中2 高3）；气泡大小=提及次数(=分布之和) */
const RAW=[
  ['高延展性材料',            [2, 8,45],[ 3,12,40],'#2E7FE8'],
  ['高强度可降解购物袋材料',   [1, 9,32],[ 2,14,26],'#3AA0D8'],
  ['医疗级透明TPE',           [2, 6,20],[ 1, 8,19],'#28B7A6'],
  ['-50℃耐寒汽车密封条',      [1, 7,14],[ 2, 6,14],'#4CAF6E'],
  ['高透膜',                  [3,12,21],[ 8,19, 9],'#5BC0BE'],
  ['手提袋专用料',            [4,11, 5],[ 2, 6,12],'#43B0F1'],
  ['耐温改性料',              [2, 7, 9],[ 4, 8, 6],'#2E7FE8'],
  ['快递袋抗撕裂料',          [3, 7, 2],[ 1, 5, 6],'#3AA0D8'],
  ['农膜流滴消雾助剂',        [4, 4, 1],[ 5, 3, 1],'#28B7A6'],
  ['低成本淀粉基共混料',      [3, 2, 0],[ 3, 2, 0],'#7EC8E3']
];
const LV=['','低','中','高'];
const TYPES=[['性能提升',28,'#5B6FD8'],['成本降低',25,'#2FC1A8'],['新应用场景',17,'#F5C560'],
             ['加工工艺优化',10,'#F0796B'],['其他',20,'#9B8FE8']];
const SRCS=[['客户需求',270],['售后工单',235],['业务人员收集',200],['招投标',155],
            ['展会/论坛',100],['舆情分析',88],['其他',178]];
const DEMANDS=['断裂伸长率提升','拉伸强度提升','耐温性能改善','降解周期可控','加工流动性优化',
  '低温韧性改善','熔体强度提升','色泽稳定性改善','气味控制','热封性能提升','抗撕裂性提升',
  '阻隔性能改善','抗静电处理','原料成本下降','原料替代方案','注塑周期缩短','吹膜稳定性',
  '厚度均匀性','印刷适性改善','抗菌性能添加'];
const USERS=[['王某','营销中心'],['李某','技术中心'],['赵某','聚酯茵创'],['周某','新材料公司'],
             ['孙某','型材公司'],['陈某','能源公司'],['吴某','品控部']];
const STATUS=[['评估中',1],['已立项',2],['已暂缓',3],['评估未通过',4]];
const avg=d=>{const n=d[0]+d[1]+d[2]; return n?(d[0]+d[1]*2+d[2]*3)/n:2};

/* ════ 明细数据：由各主题的评级分布展开，保证与图表口径一致 ════ */
let DETAIL=[];
function buildDetail(scaleK){
  const rows=[];
  RAW.forEach(function(r,pi){
    const vd=r[1].map(x=>Math.round(x*scaleK)), ud=r[2].map(x=>Math.round(x*scaleK));
    // 价值序列与紧急度序列各自展开后按序配对
    const vs=[],us=[];
    [1,2,3].forEach(function(lv){ for(let i=0;i<vd[lv-1];i++) vs.push(lv); });
    [1,2,3].forEach(function(lv){ for(let i=0;i<ud[lv-1];i++) us.push(lv); });
    const n=Math.max(vs.length, 1);
    for(let i=0;i<n;i++){
      rows.push({p:r[0], pi:pi, v:vs[i]||2, u:us[i%Math.max(us.length,1)]||2});
    }
  });
  // 按目标比例分配「需求类型」「需求来源」
  const total=rows.length;
  const typeQuota=TYPES.map(t=>Math.round(total*t[1]/100));
  const srcTot=SRCS.reduce((a,b)=>a+b[1],0);
  const srcQuota=SRCS.map(s=>Math.round(total*s[1]/srcTot));
  let ti=0,tc=0,si=0,sc=0;
  rows.forEach(function(r,i){
    while(ti<TYPES.length-1 && tc>=typeQuota[ti]){ti++;tc=0}
    r.t=TYPES[ti][0]; tc++;
    while(si<SRCS.length-1 && sc>=srcQuota[si]){si++;sc=0}
    r.s=SRCS[si][0]; sc++;
    const u=USERS[(i*3+r.pi)%USERS.length];
    r.user=u[0]; r.dept=u[1];
    const st=STATUS[(i*7+r.pi*3)%STATUS.length];
    r.st=st[0]; r.stc=st[1];
    const mo=1+((i*5+r.pi)%12), da=1+((i*11)%28);
    r.date=(mo>5?'2025':'2026')+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');
    r.title=r.p+' · '+DEMANDS[(i*3+r.pi*7)%DEMANDS.length];
    r.no=i+1;
  });
  return rows;
}

function scaled(){
  const m=+document.getElementById('rng').value, k=m===12?1:(m===6?0.55:0.3);
  DETAIL=buildDetail(k);
  return RAW.map(function(r){
    const vd=r[1].map(x=>Math.round(x*k)), ud=r[2].map(x=>Math.round(x*k));
    const c=vd[0]+vd[1]+vd[2];
    return {name:r[0], vd:vd, ud:ud, cnt:Math.max(1,c), v:avg(vd), u:avg(ud), color:r[3]};
  });
}

/* ════ 需求明细弹窗 ════ */
let mRows=[], mPage=1; const MPER=10;
function openM(cond, rows){
  mRows=rows; mPage=1;
  document.getElementById('mCond').textContent=cond;
  document.getElementById('mask').classList.add('show');
  renderM();
}
function closeM(){ document.getElementById('mask').classList.remove('show') }
function viewDemand(i){
  const r=mRows[i]; if(!r)return;
  toast('打开需求详情：'+r.title+'（'+r.st+'）');
}
function goM(p){ const t=Math.max(1,Math.ceil(mRows.length/MPER)); if(p<1||p>t)return; mPage=p; renderM() }
function renderM(){
  const tot=mRows.length, pages=Math.max(1,Math.ceil(tot/MPER));
  const slice=mRows.slice((mPage-1)*MPER, mPage*MPER);
  const tg=v=>'<span class="tg tg-'+(v===3?'h':(v===2?'m':'l'))+'">'+LV[v]+'</span>';
  document.getElementById('mCnt').textContent='共 '+tot+' 条';
  document.getElementById('mBody').innerHTML = slice.length ? slice.map(function(r,i){
    return '<tr><td>'+((mPage-1)*MPER+i+1)+'</td><td class="l">'+esc(r.title)+'</td><td>'+esc(r.p)+'</td>'+
      '<td>'+r.t+'</td><td>'+tg(r.v)+'</td><td>'+tg(r.u)+'</td><td>'+r.s+'</td>'+
      '<td>'+r.user+'</td><td>'+r.date+'</td><td><span class="st st-'+r.stc+'">'+r.st+'</span></td>'+
      '<td><span class="act" onclick="viewDemand('+((mPage-1)*MPER+i)+')">查看</span></td></tr>';
  }).join('') : '<tr><td colspan="11" style="padding:50px 0;color:#98a1af">暂无符合条件的需求</td></tr>';
  document.getElementById('mInfo').textContent='第 '+mPage+' / '+pages+' 页';
  let s='<span class="pg '+(mPage<=1?'dis':'')+'" onclick="goM('+(mPage-1)+')">‹</span>';
  const from=Math.max(1,mPage-2), to=Math.min(pages,from+4);
  for(let i=from;i<=to;i++) s+='<span class="pg '+(i===mPage?'on':'')+'" onclick="goM('+i+')">'+i+'</span>';
  s+='<span class="pg '+(mPage>=pages?'dis':'')+'" onclick="goM('+(mPage+1)+')">›</span>';
  document.getElementById('mPager').innerHTML=s;
}

/* ════ 气泡图 ════ */
const PX0=76, PX1=680, PY0=42, PY1=362;
const mapX=v=>PX0+(v-1)/2*(PX1-PX0);
const mapY=u=>PY1-(u-1)/2*(PY1-PY0);
const radius=c=>Math.min(38,Math.max(14,8+Math.sqrt(c)*3.5));
function relax(p){
  for(let it=0;it<70;it++){let mv=false;
    for(let i=0;i<p.length;i++)for(let k=i+1;k<p.length;k++){
      const a=p[i],b=p[k];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||.01;
      const need=a.r+b.r+3;
      if(d<need){const s=(need-d)/2,ux=dx/d,uy=dy/d;a.x-=ux*s;a.y-=uy*s;b.x+=ux*s;b.y+=uy*s;mv=true}
    } if(!mv)break}
  p.forEach(q=>{q.x=Math.min(PX1-q.r-2,Math.max(PX0+q.r+2,q.x));q.y=Math.min(PY1-q.r-2,Math.max(PY0+q.r+2,q.y))});
  return p;
}
function renderBubble(D){
  let s='';
  [1,1.5,2,2.5,3].forEach(function(t){
    s+='<line x1="'+mapX(t)+'" y1="'+PY0+'" x2="'+mapX(t)+'" y2="'+PY1+'" stroke="#EDF2F8"/>';
    s+='<line x1="'+PX0+'" y1="'+mapY(t)+'" x2="'+PX1+'" y2="'+mapY(t)+'" stroke="#EDF2F8"/>';
  });
  s+='<line x1="'+PX0+'" y1="'+PY1+'" x2="'+(PX1+22)+'" y2="'+PY1+'" stroke="#5BC0DE" stroke-width="1.2"/>';
  s+='<line x1="'+PX0+'" y1="'+(PY0-14)+'" x2="'+PX0+'" y2="'+PY1+'" stroke="#5BC0DE" stroke-width="1.2"/>';
  s+='<path d="M'+(PX1+22)+','+PY1+' l-6,-3 l0,6 z" fill="#5BC0DE"/>';
  s+='<path d="M'+PX0+','+(PY0-14)+' l-3,6 l6,0 z" fill="#5BC0DE"/>';
  [1,2,3].forEach(function(t){
    s+='<text x="'+mapX(t)+'" y="'+(PY1+20)+'" text-anchor="middle" font-size="12" fill="#5b6472">'+LV[t]+'</text>';
    s+='<text x="'+(PX0-12)+'" y="'+(mapY(t)+4)+'" text-anchor="end" font-size="12" fill="#5b6472">'+LV[t]+'</text>';
  });
  s+='<text x="'+(PX0-12)+'" y="'+(PY0-20)+'" text-anchor="end" font-size="12" fill="#5b6472">紧急度</text>';
  s+='<text x="'+(PX1+28)+'" y="'+(PY1+5)+'" font-size="12" fill="#5b6472">价值</text>';

  const pts=relax(D.map(function(d,i){return {i:i,x:mapX(d.v),y:mapY(d.u),r:radius(d.cnt),d:d}}));
  pts.forEach(function(p){
    const d=p.d, small=p.r<20;
    s+='<g class="bub" data-i="'+p.i+'" style="cursor:pointer">'+
       '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+p.r.toFixed(1)+'" fill="'+d.color+'" opacity=".88"/>';
    if(small) s+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y+4).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="#fff">'+d.cnt+'</text>';
    else{
      const nm=d.name.length>7?d.name.slice(0,6)+'…':d.name;
      s+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-2).toFixed(1)+'" text-anchor="middle" font-size="10.5" fill="#fff">'+esc(nm)+'</text>'+
         '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+12).toFixed(1)+'" text-anchor="middle" font-size="10.5" fill="#fff">次数: '+d.cnt+'</text>';
    }
    s+='</g>';
  });
  document.getElementById('mx').innerHTML=s;

  const tip=document.getElementById('tip'), wrap=document.getElementById('mx').parentNode;
  document.querySelectorAll('#mx .bub').forEach(function(g){
    g.addEventListener('mousemove',function(e){
      const d=D[+g.dataset.i], f=a=>'高 '+a[2]+' · 中 '+a[1]+' · 低 '+a[0];
      tip.innerHTML='<b>'+esc(d.name)+'</b>'+
        '<div class="r"><span class="k">提及次数</span><span>'+d.cnt+' 次</span></div>'+
        '<div class="r"><span class="k">价值评级</span><span>'+f(d.vd)+'</span></div>'+
        '<div class="r"><span class="k">价值均值</span><span>'+d.v.toFixed(2)+'</span></div>'+
        '<div class="r"><span class="k">紧急度评级</span><span>'+f(d.ud)+'</span></div>'+
        '<div class="r"><span class="k">紧急度均值</span><span>'+d.u.toFixed(2)+'</span></div>'+
        '<div class="r" style="color:#7fb0e8;margin-top:2px">点击查看需求明细</div>';
      const b=wrap.getBoundingClientRect();
      let x=e.clientX-b.left+14,y=e.clientY-b.top+14;
      if(x+215>b.width)x=e.clientX-b.left-215;
      tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.add('show');
    });
    g.addEventListener('mouseleave',()=>tip.classList.remove('show'));
    g.addEventListener('click',function(){
      const d=D[+g.dataset.i];
      openM('关联产品：'+d.name, DETAIL.filter(r=>r.p===d.name));
    });
  });
}

/* ════ 高优先级需求：综合优先级排序 + 检索 + 分页 ════ */
let hvAll=[], hvRows=[], hvPage=1; const HVPER=10;
function hvGo(p){ hvPage=p; renderHVBody() }
function renderHV(){
  hvAll = DETAIL.filter(function(r){ return (r.v===3&&r.u>=2) || (r.u===3&&r.v>=2) })
    .sort(function(a,b){
      const d=(b.v+b.u)-(a.v+a.u); if(d) return d;
      return a.date<b.date?1:(a.date>b.date?-1:0);
    });
  hvPage=1; renderHVBody();
}
function renderHVBody(){
  const q=((document.getElementById('hvQ')||{}).value||'').trim().toLowerCase();
  hvRows = q ? hvAll.filter(function(r){
      return r.title.toLowerCase().indexOf(q)>=0 || r.p.toLowerCase().indexOf(q)>=0;
    }) : hvAll;
  const tot=hvRows.length, pages=Math.max(1,Math.ceil(tot/HVPER));
  if(hvPage>pages) hvPage=pages;
  const slice=hvRows.slice((hvPage-1)*HVPER, hvPage*HVPER);
  const tg=v=>'<span class="tg tg-'+(v===3?'h':(v===2?'m':'l'))+'">'+LV[v]+'</span>';
  document.getElementById('hvBody').innerHTML = slice.length
    ? slice.map(function(r,i){
        const idx=(hvPage-1)*HVPER+i;
        return '<tr><td>'+(idx+1)+'</td>'+
          '<td class="l" title="'+esc(r.title)+'">'+esc(r.title)+'</td>'+
          '<td class="nw" title="'+esc(r.p)+'">'+esc(r.p)+'</td>'+
          '<td>'+tg(r.v)+'</td><td>'+tg(r.u)+'</td>'+
          '<td style="color:#5b6472">'+r.date+'</td>'+
          '<td><span class="act" onclick="viewHV('+idx+')">查看</span></td></tr>';
      }).join('')
    : '<tr><td colspan="7" style="padding:60px 0;color:#98a1af">'+(q?'未找到匹配的需求':'当前时间范围内暂无高优先级需求')+'</td></tr>';
  document.getElementById('hvInfo').textContent='共 '+tot+' 条 · 第 '+hvPage+'/'+pages+' 页';
  let pg='<span class="pg'+(hvPage<=1?' dis':'')+'" onclick="'+(hvPage>1?'hvGo('+(hvPage-1)+')':'')+'">‹</span>';
  const st=Math.max(1,Math.min(hvPage-1,pages-2)), en=Math.min(pages,st+2);
  if(st>1) pg+='<span class="pg" onclick="hvGo(1)">1</span>'+(st>2?'<span style="color:#98a1af;padding:0 2px">…</span>':'');
  for(let i=st;i<=en;i++) pg+='<span class="pg'+(i===hvPage?' on':'')+'" onclick="hvGo('+i+')">'+i+'</span>';
  if(en<pages) pg+=(en<pages-1?'<span style="color:#98a1af;padding:0 2px">…</span>':'')+'<span class="pg" onclick="hvGo('+pages+')">'+pages+'</span>';
  pg+='<span class="pg'+(hvPage>=pages?' dis':'')+'" onclick="'+(hvPage<pages?'hvGo('+(hvPage+1)+')':'')+'">›</span>';
  document.getElementById('hvPager').innerHTML=pg;
}
function viewHV(i){ const r=hvRows[i]; if(r) toast('打开需求详情：'+r.title+'（'+r.st+'）') }

/* ════ 需求类型分布（环形图，可点击）════ */
function renderDonut(){
  const m={}; DETAIL.forEach(r=>{m[r.t]=(m[r.t]||0)+1});
  const tot=DETAIL.length||1;
  const cx=280,cy=114,r=72,w=26,C=2*Math.PI*r;
  let s='', acc=0;
  TYPES.forEach(function(t){
    const cnt=m[t[0]]||0, pct=cnt/tot*100, len=C*cnt/tot;
    s+='<circle class="seg" data-t="'+t[0]+'" style="cursor:pointer" cx="'+cx+'" cy="'+cy+'" r="'+r+
       '" fill="none" stroke="'+t[2]+'" stroke-width="'+w+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+
       '" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')">'+
       '<title>'+t[0]+'：'+cnt+' 条（'+pct.toFixed(0)+'%）　点击查看明细</title></circle>';
    const mid=(acc+len/2)/C*360-90, rad=mid*Math.PI/180;
    const x1=cx+Math.cos(rad)*(r+w/2), y1=cy+Math.sin(rad)*(r+w/2);
    const x2=cx+Math.cos(rad)*(r+40), y2=cy+Math.sin(rad)*(r+40);
    const right=Math.cos(rad)>=0, x3=right?x2+26:x2-26;
    s+='<path d="M'+x1.toFixed(1)+','+y1.toFixed(1)+' L'+x2.toFixed(1)+','+y2.toFixed(1)+' L'+x3.toFixed(1)+','+y2.toFixed(1)+
       '" fill="none" stroke="#9FCBEA" stroke-width="1"/>';
    const lx=(right?x3+6:x3-6), la=(right?'start':'end');
    s+='<text x="'+lx+'" y="'+(y2+4).toFixed(1)+'" text-anchor="'+la+'" font-size="12">'+
       '<tspan font-size="12.5" font-weight="600" fill="#5b6472">'+pct.toFixed(0)+'%</tspan>'+
       '<tspan fill="#98a1af"> · '+cnt+' 条</tspan></text>';
    acc+=len;
  });
  document.getElementById('donut').innerHTML=s;
  document.querySelectorAll('#donut .seg').forEach(function(c){
    c.addEventListener('click',function(){
      const t=c.dataset.t;
      openM('需求类型：'+t, DETAIL.filter(r=>r.t===t));
    });
  });
  document.getElementById('donutLg').innerHTML=TYPES.map(function(t){
    return '<span class="i" style="cursor:pointer" onclick="openM(\'需求类型：'+t[0]+'\', DETAIL.filter(r=>r.t===\''+t[0]+'\'))">'+
      '<i class="sw" style="background:'+t[2]+'"></i>'+t[0]+
      '<b style="font-weight:600;color:#1d2129;margin-left:2px">'+(m[t[0]]||0)+'</b></span>';
  }).join('');
}

/* ════ 需求来源分布（柱状图，可点击）════ */
function renderSrc(){
  const m={}; DETAIL.forEach(r=>{m[r.s]=(m[r.s]||0)+1});
  const vals=SRCS.map(s=>m[s[0]]||0);
  const maxV=Math.max.apply(null,vals), step=Math.pow(10,String(Math.floor(maxV)).length-1);
  const max=Math.max(step*2, Math.ceil(maxV/step)*step);
  const X0=60,X1=670,Y0=24,Y1=222, n=SRCS.length, band=(X1-X0)/n, bw=32;
  let s='';
  for(let i=0;i<=3;i++){
    const v=max/3*i, y=Y1-v/max*(Y1-Y0);
    s+='<line x1="'+X0+'" y1="'+y.toFixed(1)+'" x2="'+X1+'" y2="'+y.toFixed(1)+'" stroke="#EDF2F8"/>';
    s+='<text x="'+(X0-10)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11.5" fill="#98a1af">'+Math.round(v)+'</text>';
  }
  s+='<line x1="'+X0+'" y1="'+Y1+'" x2="'+X1+'" y2="'+Y1+'" stroke="#D6E2EE"/>';
  SRCS.forEach(function(d,i){
    const v=m[d[0]]||0, cx=X0+band*i+band/2, hh=v/max*(Y1-Y0), y=Y1-hh;
    s+='<g class="barg" data-s="'+d[0]+'" style="cursor:pointer">'+
       '<rect x="'+(cx-band/2+4)+'" y="'+Y0+'" width="'+(band-8)+'" height="'+(Y1-Y0)+'" fill="transparent"/>'+
       '<rect x="'+(cx-bw/2)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" fill="#28ABE3">'+
       '<title>'+d[0]+'：'+v+' 条　点击查看明细</title></rect>'+
       '<text x="'+cx+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="11" fill="#5b6472">'+v+'</text>'+
       '<text x="'+cx+'" y="'+(Y1+20)+'" text-anchor="middle" font-size="11.5" fill="#5b6472">'+d[0]+'</text></g>';
  });
  document.getElementById('srcChart').innerHTML=s;
  document.querySelectorAll('#srcChart .barg').forEach(function(g){
    g.addEventListener('click',function(){
      const k=g.dataset.s;
      openM('需求来源：'+k, DETAIL.filter(r=>r.s===k));
    });
  });
}

function render(){ const D=scaled(); renderBubble(D); renderHV(); renderDonut(); renderSrc(); }
render();
</script></body></html>
