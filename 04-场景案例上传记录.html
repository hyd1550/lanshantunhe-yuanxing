<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>场景案例上传记录</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f7fa;--bg3:#eef1f5;--border:#e4e8ee;--border2:#cfd6e0;
 --text:#1d2129;--text2:#5b6472;--text3:#98a1af;--blue:#1B62C4;--blue-bg:#EAF2FE;
 --green:#0F7B4A;--green-bg:#E6F6EE;--amber:#8A5A0B;--amber-bg:#FDF2DE;--red:#C0392B;--red-bg:#FDECEA}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
.app{width:1660px;height:990px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg2)}
.tbar{flex-shrink:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--bg);border-bottom:1px solid var(--border)}
.tbar .bar{width:3px;height:15px;background:var(--blue);border-radius:2px}
.ttl{font-size:15px;font-weight:600}.sp{flex:1}
.tip{font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:99px;padding:4px 12px}
.tools{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:14px 22px 8px;flex-wrap:wrap;background:var(--bg);border-bottom:1px solid var(--border)}
.lb{font-size:12.5px;color:var(--text2);white-space:nowrap}
.fsel,.finp{height:34px;padding:0 10px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);font-family:inherit;font-size:12.5px;color:var(--text);outline:none}
.finp{width:230px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;font-size:12.5px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.pri:hover{opacity:.9}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.dang{background:var(--red-bg);color:var(--red);border-color:#f0c8c3}
.body{flex:1;overflow-y:auto;padding:16px 22px}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.p-on{background:var(--green-bg);color:var(--green)}
.p-draft{background:var(--amber-bg);color:var(--amber)}
.p-off{background:var(--bg3);color:var(--text3)}
.p-scene{background:var(--blue-bg);color:var(--blue)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--bg);border-radius:8px;overflow:hidden}
table.t th,table.t td{padding:15px 14px;text-align:left;border-bottom:1px solid var(--border);line-height:1.6}
table.t thead th{background:#fafbfc;color:var(--text2);font-weight:600;font-size:11.5px;white-space:nowrap;padding:12px 14px}
table.t tbody tr:hover{background:#fafbfd}
table.t tr:last-child td{border-bottom:none}
.act{color:var(--blue);cursor:pointer;margin-right:12px;font-size:12.5px}
.act:hover{text-decoration:underline}
.act.del{color:var(--red)}.act.off{color:var(--text2)}
.pager{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px}
.pg-info{color:var(--text3);margin-right:auto}
.pg{min-width:30px;height:30px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:6px;background:var(--bg);cursor:pointer}
.pg:hover{border-color:var(--blue);color:var(--blue)}
.pg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg.dis{color:var(--text3);cursor:default;background:var(--bg2)}
.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;padding:9px 17px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--text2);background:var(--blue-bg);border-left:3px solid var(--blue);border-radius:4px;padding:9px 13px;line-height:1.6;margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;background:var(--bg);border-radius:8px 8px 0 0;padding:0 8px}
.tb{padding:11px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tb:hover{color:var(--text)}
.tb.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tb .c{font-size:11.5px;background:var(--bg3);color:var(--text2);border-radius:99px;padding:1px 8px;font-weight:500}
.tb.on .c{background:var(--blue-bg);color:var(--blue)}
.mask{position:absolute;inset:0;background:rgba(29,33,41,.42);display:none;align-items:center;justify-content:center;z-index:60}
.mask.show{display:flex}
.mod{width:560px;background:var(--bg);border-radius:11px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.mod-hd{padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
.mod-hd .x{margin-left:auto;cursor:pointer;color:var(--text3);font-size:18px;line-height:1}
.mod-hd .x:hover{color:var(--text)}
.mod-bd{padding:17px 18px;max-height:470px;overflow-y:auto;font-size:12.5px;line-height:1.75}
.mod-ft{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:#fafbfc}
.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 12px}
.kv .k{color:var(--text2)}
.kv .v{color:var(--text)}
.msum{background:#fafbfc;border-left:3px solid var(--border2);border-radius:4px;padding:10px 13px;margin:13px 0;line-height:1.8;color:var(--text2)}
.mwarn{background:var(--amber-bg);border-left:3px solid #dfa63c;border-radius:4px;padding:10px 13px;color:#7a5210;line-height:1.75}
.mdang{background:var(--red-bg);border-left:3px solid #e08e84;border-radius:4px;padding:10px 13px;color:var(--red);line-height:1.75}</style></head><body>
<div class="app">
  <div class="tbar"><span class="bar"></span><span class="ttl">场景案例上传记录</span>
  </div>
  <div class="tools">
    <span class="lb">应用场景</span>
    <select class="fsel" id="fsc" onchange="render()" style="width:170px"><option value="">全部场景</option><option>农业园艺（农膜）</option><option>包装产业</option><option>母婴用品</option><option>日用消费品</option><option>纺织纤维与鞋服</option><option>一次性医用耗材</option><option>3D打印</option><option>防沙环保</option><option>轻量化应用</option><option>渔牧业</option><option>电子产品</option></select>
    <span class="lb">关键字</span>
    <input class="finp" id="q" placeholder="案例名称 / 产品名称" oninput="render()">
    <button class="btn pri" onclick="render()">搜索</button>
    <button class="btn" onclick="reset()">重置</button>
  </div>
  <div class="body">
    <div style="margin-bottom:12px"><button class="btn pri" onclick="toast('跳转到「新增/编辑案例」页，可选择应用场景后按模板填写')">＋ 新增案例</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
  <div class="mask" id="mask"><div class="mod">
    <div class="mod-hd"><span id="mTtl">标题</span><span class="x" onclick="closeM()">×</span></div>
    <div class="mod-bd" id="mBody"></div>
    <div class="mod-ft" id="mFoot"></div>
  </div></div>
  <div class="toast" id="toast"></div>
</div>
<script>

let page=1, quick='';
const PER=10;
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)}
function reset(){document.getElementById('fsc').value='';document.getElementById('q').value='';quick='';page=1;render()}
function setQuick(s){quick=s;page=1;render()}
function filtered(){
  const sc=document.getElementById('fsc').value,
        q=(document.getElementById('q').value||'').trim();
  return CASES.filter(c=>{
    if(sc&&c.sc!==sc)return false;
    if(quick&&c.st!==quick)return false;
    if(q&&c.t.indexOf(q)<0&&c.p.indexOf(q)<0)return false;
    return true;
  });
}
function pillCls(s){return s==='已发布'?'p-on':(s==='草稿'?'p-draft':'p-off')}
function render(){
  const cnt={'全部':CASES.length,'已发布':0,'草稿':0,'已下架':0};
  CASES.forEach(c=>cnt[c.st]++);
  document.getElementById('tabs').innerHTML=['全部','已发布','草稿','已下架'].map(k=>
    '<div class="tb'+((quick===k||(k==='全部'&&!quick))?' on':'')+'" onclick="setQuick(\''+(k==='全部'?'':k)+'\')">'+
    k+'<span class="c">'+cnt[k]+'</span></div>').join('');
  const rows=filtered(), tot=Math.max(1,Math.ceil(rows.length/PER));
  if(page>tot)page=tot;
  const slice=rows.slice((page-1)*PER,page*PER);
  document.getElementById('list').innerHTML=
    '<table class="t"><thead><tr><th style="width:46px;text-align:center">序号</th><th>案例名称</th>'+
    '<th style="width:140px">应用场景</th><th style="width:150px">产品名称</th><th style="width:90px">状态</th>'+
    '<th style="width:80px">上传人</th><th style="width:110px">更新时间</th><th style="width:190px">操作</th></tr></thead><tbody>'+
    (slice.length?slice.map((c,i)=>{
      const off=c.st==='已下架', draft=c.st==='草稿';
      return '<tr'+(off?' style="color:var(--text3)"':'')+'>'+
      '<td style="text-align:center;color:var(--text3)">'+((page-1)*PER+i+1)+'</td>'+
      '<td style="font-weight:500'+(off?';color:var(--text3)':'')+'">'+c.t+'</td>'+
      '<td><span class="pill p-scene">'+c.sc+'</span></td><td>'+c.p+'</td>'+
      '<td><span class="pill '+pillCls(c.st)+'">'+c.st+'</span></td>'+
      '<td>'+c.u+'</td><td style="color:var(--text2)">'+c.d+'</td>'+
      '<td><span class="act" onclick="goView('+c.id+')">查看</span>'+
        '<span class="act" onclick="goEdit('+c.id+')">编辑</span>'+
        (draft?'<span class="act" onclick="mPublish('+c.id+')">发布</span>'
              :(off?'<span class="act" onclick="mRepublish('+c.id+')">重新发布</span>'
                   :'<span class="act off" onclick="mOffline('+c.id+')">下架</span>'))+
        '<span class="act del" onclick="mDelete('+c.id+')">删除</span></td></tr>';
    }).join('')
    :'<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:60px 0">暂无符合条件的记录</td></tr>')+
    '</tbody></table>';
  let h='<span class="pg-info">共 '+rows.length+' 条 · 第 '+page+'/'+tot+' 页</span>';
  h+='<span class="pg '+(page<=1?'dis':'')+'" onclick="go('+(page-1)+')">‹</span>';
  for(let i=1;i<=tot;i++)h+='<span class="pg '+(i===page?'on':'')+'" onclick="go('+i+')">'+i+'</span>';
  h+='<span class="pg '+(page>=tot?'dis':'')+'" onclick="go('+(page+1)+')">›</span>';
  document.getElementById('pager').innerHTML=h;
}
function go(p){const tot=Math.max(1,Math.ceil(filtered().length/PER));if(p<1||p>tot)return;page=p;render()}

/* ════════ 操作弹窗 ════════ */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const byId=id=>CASES.find(c=>c.id===id);
function closeM(){document.getElementById('mask').classList.remove('show')}
function showM(title,body,foot){
  document.getElementById('mTtl').innerHTML=title;
  document.getElementById('mBody').innerHTML=body;
  document.getElementById('mFoot').innerHTML=foot;
  document.getElementById('mask').classList.add('show');
}
const btnCancel='<button class="btn" onclick="closeM()">取消</button>';

/* 查看 / 编辑：直接跳转，不弹窗 */
function goView(id){const c=byId(id);toast('跳转到案例详情页：'+c.t)}
function goEdit(id){const c=byId(id);toast('跳转到「新增/编辑案例」页，带入：'+c.t)}

/* 发布 / 重新发布 / 下架 / 删除 */
function doAct(id,st,msg){
  const c=byId(id); if(st==='__del'){const i=CASES.findIndex(x=>x.id===id);CASES.splice(i,1)} else c.st=st;
  closeM();render();toast(msg);
}
function mPublish(id){
  const c=byId(id);
  showM('发布案例',
    '<div class="kv"><div class="k">案例名称</div><div class="v" style="font-weight:600">'+esc(c.t)+'</div></div>'+
    '<div class="mwarn" style="margin-top:13px">发布后该案例将立即在「场景化案例库」中展示，全部用户可见。<br>'+
    '本模块由授权人员维护，<b>发布无需审核</b>。</div>',
    btnCancel+'<button class="btn pri" onclick="doAct('+id+',\'已发布\',\'已发布，案例库中已可见\')">确认发布</button>');
}
function mRepublish(id){
  const c=byId(id);
  showM('重新发布',
    '<div class="kv"><div class="k">案例名称</div><div class="v" style="font-weight:600">'+esc(c.t)+'</div>'+
    '<div class="k">当前状态</div><div class="v"><span class="pill p-off">已下架</span></div></div>'+
    '<div class="mwarn" style="margin-top:13px">重新发布前请确认内容仍然适用。<br>该案例下架原因：产品已迭代，参数可能不再适用。</div>',
    btnCancel+'<button class="btn pri" onclick="doAct('+id+',\'已发布\',\'已重新发布\')">确认发布</button>');
}
function mOffline(id){
  const c=byId(id);
  showM('下架案例',
    '<div class="kv"><div class="k">案例名称</div><div class="v" style="font-weight:600">'+esc(c.t)+'</div></div>'+
    '<div class="mwarn" style="margin-top:13px">下架后该案例<b>不在案例库展示</b>，但记录与内容完整保留，可随时重新发布。<br>'+
    '适用于产品迭代、参数过期等场景。</div>',
    btnCancel+'<button class="btn" onclick="doAct('+id+',\'已下架\',\'已下架，案例库中不再展示\')">确认下架</button>');
}
function mDelete(id){
  const c=byId(id);
  showM('删除案例',
    '<div class="kv"><div class="k">案例名称</div><div class="v" style="font-weight:600">'+esc(c.t)+'</div>'+
    '<div class="k">上传人</div><div class="v">'+esc(c.u)+'</div></div>'+
    '<div class="mdang" style="margin-top:13px"><b>删除后不可恢复</b>，案例内容与已上传的图片、附件将一并清除。<br>'+
    '如只是暂时不展示，建议改用「下架」。</div>',
    btnCancel+'<button class="btn dang" onclick="doAct('+id+',\'__del\',\'案例已删除\')">确认删除</button>');
}

render();
</script></body></html>
