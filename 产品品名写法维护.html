<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>产品品名写法维护</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#f0efe9;--border:#e2e0da;--border2:#c8c6bc;
  --text:#1a1a18;--text2:#6b6960;--text3:#9c9a90;
  --blue:#185FA5;--blue-bg:#E6F1FB;--teal:#0F6E56;--teal-bg:#E1F5EE;
  --amber:#8A5A0B;--amber-bg:#FAEEDA;--green:#27500A;--green-bg:#EAF3DE;--red:#A32D2D;--red-bg:#FCEBEB;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
.app{width:1660px;height:990px;background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;position:relative}
.tbar{flex-shrink:0;height:50px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--bg);border-bottom:1px solid var(--border)}
.crumb{font-size:12.5px;color:var(--text3)}
.crumb b{color:var(--text);font-weight:600;font-size:14px}
.sp{flex:1}
.tools{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:14px 22px 12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);width:340px}
.search input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;background:transparent;color:var(--text)}
.fsel{height:36px;padding:0 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);font-family:inherit;font-size:12.5px;color:var(--text)}
.hint{font-size:12px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:12.5px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{opacity:.9}
.btn.dang{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:0 12px;height:32px}
.tblwrap{overflow:auto;margin:0 22px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.pager{display:flex;align-items:center;gap:6px;margin:0 22px 16px;font-size:12.5px;color:var(--text3)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:15px 18px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);vertical-align:middle}
table.t thead th{position:sticky;top:0;background:var(--bg2);color:var(--text2);font-weight:600;font-size:11.5px;z-index:1}
table.t tbody tr:hover{background:var(--bg2)}
table.t tr:last-child td{border-bottom:none}
table.t td.wrap{white-space:normal}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500}
.st-on{background:var(--green-bg);color:var(--green)}
.st-off{background:var(--bg3);color:var(--text3)}
.act{color:var(--blue);cursor:pointer;margin-right:14px}
.act:hover{text-decoration:underline}
.act.red{color:var(--red)}
.muted{color:var(--text3)}
.pname{font-weight:600}
.kw{display:inline-block;background:var(--bg3);color:var(--text2);border-radius:5px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.more{font-size:12px;color:var(--text3)}
/* drawer */
.dov{position:absolute;inset:0;background:rgba(20,25,35,.45);display:none;z-index:50}
.dov.show{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:980px;background:var(--bg);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.dhd{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--border)}
.dhd h3{font-size:15px;font-weight:600;flex:1}
.mx{cursor:pointer;color:var(--text2);width:28px;height:28px;border:1px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center}
.dbody{flex:1;overflow-y:auto;padding:18px 22px}
.dft{padding:12px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sect{font-size:13.5px;font-weight:600;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.sect .n{font-weight:400;color:var(--text3);font-size:12px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px;margin-bottom:24px}
.fr label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
.fr label i{color:var(--red);font-style:normal;margin-left:2px}
.inp{height:34px;width:100%;padding:0 10px;font-size:13px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.inp:focus{border-color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden;height:34px}
.seg span{padding:0 16px;display:flex;align-items:center;font-size:12.5px;cursor:pointer;color:var(--text2);border-right:1px solid var(--border2)}
.seg span:last-child{border-right:none}
.seg span.on{background:var(--blue);color:#fff}
.addbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.new{background:var(--amber-bg);color:var(--amber)}
.dir{background:var(--blue-bg);color:var(--blue)}
.dir.im{background:var(--teal-bg);color:var(--teal)}
.wt td{padding:11px 18px}
.wt .w{font-weight:500}
/* modal */
.ov{position:absolute;inset:0;background:rgba(20,25,35,.5);display:none;align-items:center;justify-content:center;z-index:70}
.ov.show{display:flex}
.modal .mbody{overflow-y:auto}
.ndw{flex:1;display:flex;min-height:0}
.ndl{width:220px;border-right:1px solid var(--border);overflow-y:auto;padding:6px 0}
.ndl div{padding:10px 18px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.ndl div:hover{background:var(--bg2)}
.ndl div.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
.bd{margin-left:auto;background:var(--blue);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.ndr{flex:1;display:flex;flex-direction:column;padding:14px 18px;min-width:0}
.ndlist{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.ndi{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.ndi:last-child{border-bottom:none}
.ndi:hover{background:var(--bg2)}
.ndi .nm{flex:1;min-width:0}
.modal{background:var(--bg);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;width:420px}
.mhd{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border)}
.mhd h3{font-size:15px;font-weight:600;flex:1}
.mbody{padding:16px 20px;font-size:13px;line-height:1.7;color:var(--text2)}
.mft{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 18px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="tbar"><span class="crumb"><b>产品品名写法维护</b></span><span class="sp"></span>
    <button class="btn" onclick="toast('已导出产品及品名写法清单')">导出</button><button class="btn pri" onclick="openEdit(null)">＋ 新增产品</button></div>
  <div class="tools">
    <div class="search"><span style="color:var(--text3)">🔍</span><input id="q" placeholder="搜索产品、中文名称、HS编码、写法或环节" oninput="render()"></div>
    <select class="fsel" id="fst" onchange="render()"><option value="">全部状态</option><option>启用</option><option>停用</option></select>
  </div>
  <div class="tblwrap"><table class="t">
    <thead><tr><th>产品</th><th>中文名称</th><th>常用HS编码</th><th>品名写法</th><th>关联环节</th><th>状态</th><th>更新人</th><th>更新时间</th><th>操作</th></tr></thead>
    <tbody id="tb"></tbody></table></div>
  <div class="pager" id="pager"></div>

  <div class="dov" id="dov" onclick="if(event.target===this)closeEdit()"><div class="drawer" id="drawer"></div></div>

  <div class="ov" id="cov"><div class="modal">
    <div class="mhd"><h3 id="ct"></h3><div class="mx" onclick="closeC()">✕</div></div>
    <div class="mbody" id="cb"></div>
    <div class="mft"><span class="sp"></span><button class="btn" onclick="closeC()">取消</button><button class="btn dang" id="cok">确认</button></div>
  </div></div>
  <div class="ov" id="nov" onclick="if(event.target===this)closeNd()"><div class="modal" id="nbox" style="width:1000px;height:680px"></div></div>
  <div class="ov" id="tov" onclick="if(event.target===this)closeTry()"><div class="modal" id="tbox" style="width:1000px;max-height:90%"></div></div>
  <div class="toast" id="toast"></div>
</div>

  const rows=PROD.filter(x=>(!st||x.st===st)&&(!q||x.p.toLowerCase().includes(q)||x.cn.includes(q)||x.hs.includes(q)||x.kw.some(k=>k.w.toLowerCase().includes(q))||(x.nd||[]).some(id=>ndCh(id).some(c=>c[1].toLowerCase().includes(q)))));
  $('tb').innerHTML=rows.map(x=>{const i=PROD.indexOf(x);return `<tr>
    <td class="pname">${esc(x.p)}</td><td>${esc(x.cn)}</td><td>${esc(x.hs)||'<span class="muted">-</span>'}</td>
    <td class="wrap" style="max-width:640px">${x.kw.slice(0,4).map(k=>`<span class="kw" title="${esc(k.w)}">${esc(k.w)}</span>`).join('')}${x.kw.length>4?`<span class="more">等 ${x.kw.length} 种</span>`:''}</td>
    <td class="wrap" style="max-width:300px">${(x.nd||[]).length?(x.nd||[]).map(id=>`<div title="${esc(ndCh(id).map(c=>c[0]).join('、'))}">${esc(ndName(id))} <span class="muted">· ${ndCh(id).length} 条产业链</span></div>`).join(''):'<span class="muted">-</span>'}</td>
    <td><span class="pill ${x.st==='启用'?'st-on':'st-off'}">${x.st}</span></td><td>${esc(x.by)}</td><td>${esc(x.t)}</td>
    <td><span class="act" onclick="openEdit(${i})">编辑</span>${x.st==='启用'?`<span class="act" onclick="askStop(${i})">停用</span>`:`<span class="act" onclick="setSt(${i},'启用')">启用</span>`}<span class="act red" onclick="askDel(${i})">删除</span></td></tr>`}).join('')||'<tr><td colspan="9" class="muted" style="text-align:center;padding:40px">没有匹配的产品</td></tr>';
  $('pager').textContent=`共 ${rows.length} 个产品`;
}

/* ---------- 编辑 ---------- */
let E=null,EI=null,TRY=null;
function openEdit(i){EI=i;const x=i==null?{p:'',cn:'',hs:'',st:'启用',kw:[],nd:[]}:PROD[i];E=JSON.parse(JSON.stringify(x));E.nd=E.nd||[];TRY=null;renderEdit();$('dov').classList.add('show');setTimeout(()=>$(i==null?'fP':'fW').focus(),50)}
function closeEdit(){$('dov').classList.remove('show')}
function renderEdit(){
  const wv=$('fW')?$('fW').value:'',nv=$('fN')?$('fN').value:'';
  $('drawer').innerHTML=`<div class="dhd"><h3>${EI==null?'新增产品':'编辑产品'}</h3><div class="mx" onclick="closeEdit()">✕</div></div>
  <div class="dbody">
    <div class="sect">基本信息</div>
    <div class="form">
      <div class="fr"><label>产品<i>*</i></label><input class="inp" id="fP" value="${esc(E.p)}" placeholder="如 PBAT" oninput="E.p=this.value.trim()"></div>
      <div class="fr"><label>中文名称<i>*</i></label><input class="inp" id="fC" value="${esc(E.cn)}" placeholder="如 聚己二酸/对苯二甲酸丁二醇酯" oninput="E.cn=this.value.trim()"></div>
      <div class="fr"><label>常用HS编码</label><input class="inp" id="fH" value="${esc(E.hs)}" placeholder="6~10位数字，如 390799" oninput="E.hs=this.value.replace(/\\D/g,'');this.value=E.hs"></div>
      <div class="fr"><label>状态</label><div class="seg">${['启用','停用'].map(s=>`<span class="${E.st===s?'on':''}" onclick="E.st='${s}';renderEdit()">${s}</span>`).join('')}</div></div>
    </div>
    <div class="sect">关联环节<span class="n">${E.nd.length} 个</span><span class="sp"></span><button class="btn sm" onclick="openNd()">＋ 关联环节</button></div>
    <div class="tblwrap" style="margin:0 0 24px"><table class="t wt"><thead><tr><th>环节</th><th>所在产业链</th><th>操作</th></tr></thead><tbody>
    ${E.nd.map((id,j)=>`<tr><td class="w wrap" style="max-width:340px">${esc(ndName(id))}</td><td class="wrap">${ndCh(id).map(c=>`<span class="kw" title="${esc(c[1])}">${esc(shortCh(c[0]))}</span>`).join('')}</td><td><span class="act red" onclick="E.nd.splice(${j},1);renderEdit()">取消关联</span></td></tr>`).join('')||'<tr><td colspan="3" class="muted" style="text-align:center;padding:22px">未关联环节</td></tr>'}
    </tbody></table></div>
    <div class="sect">品名写法<span class="n">${E.kw.length} 种</span></div>
    <div class="addbar">
      <input class="inp" id="fW" style="width:340px" placeholder="输入写法，如 PBAT chips" value="${esc(wv)}" onkeydown="if(event.key==='Enter')addW()">
      <input class="inp" id="fN" style="width:220px" placeholder="说明（选填），如 西班牙文" value="${esc(nv)}" onkeydown="if(event.key==='Enter')addW()">
      <button class="btn sm" onclick="tryW($('fW').value,true)">试查</button><button class="btn sm pri" onclick="addW()">添加</button>
    </div>
    <div class="tblwrap" style="margin:0"><table class="t wt"><thead><tr><th>写法</th><th>说明</th><th>添加人</th><th>添加时间</th><th>操作</th></tr></thead><tbody>
    ${E.kw.map((k,j)=>`<tr><td class="w">${esc(k.w)}</td><td>${k.n?esc(k.n):'<span class="muted">-</span>'}</td><td>${esc(k.by)}</td><td>${esc(k.t)}</td><td><span class="act" onclick="tryW(decodeURIComponent('${enc(k.w)}'),false)">试查</span><span class="act red" onclick="rmW(${j})">删除</span></td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="text-align:center;padding:28px">还没有品名写法</td></tr>'}
    </tbody></table></div>
  </div>
  <div class="dft"><span class="sp"></span><button class="btn" onclick="closeEdit()">取消</button><button class="btn pri" onclick="save()">保存</button></div>`;
}
function owner(w){return PROD.find((x,i)=>i!==EI&&x.kw.some(k=>same(k.w,w)))}
function addW(){const w=$('fW').value.trim(),n=$('fN').value.trim();if(!w)return;
  if(E.kw.some(k=>same(k.w,w))){toast('该写法已存在');return}
  const o=owner(w);if(o){toast(`“${w}”已在 ${o.p} 下维护，同一写法只能属于一个产品`);return}
  E.kw.push({w,n,by:'营销中心',t:now().slice(0,10)});$('fW').value='';$('fN').value='';renderEdit();$('fW').focus()}
function rmW(j){E.kw.splice(j,1);renderEdit()}

/* ---------- 试查 ---------- */
// 按完整单词匹配（与国贸通接口一致）：不区分大小写、忽略标点，如 LOGISTIC 匹配不到 LOGISTICS
const wN=t=>' '+String(t).toUpperCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()+' ';
const hitW=(o,w)=>wN(o.t+' '+o.x).includes(wN(w));
function tryW(w,isNew){w=String(w).trim();if(!w){toast('请先输入写法');return}TRY={w,isNew,dir:'EX'};renderTry();$('tov').classList.add('show')}
function closeTry(){$('tov').classList.remove('show')}
function renderTry(){
  const w=TRY.w,others=E.kw.map(k=>k.w).filter(k=>!same(k,w));const cnt=a=>a.reduce((s,o)=>s+o.n,0);
  const hit=DESC.filter(o=>o.d===TRY.dir&&hitW(o,w));const only=hit.filter(o=>!others.some(k=>hitW(o,k)));
  const hsOff=E.hs?hit.filter(o=>!o.h.startsWith(E.hs)):[];
  const list=only.concat(hit.filter(o=>!only.includes(o)));
  const lab=TRY.isNew?'现有写法查不到':'只有该写法能查到';
  $('tbox').innerHTML=`<div class="mhd"><h3>试查“${esc(w)}”</h3><div class="mx" onclick="closeTry()">✕</div></div>
  <div class="mbody" style="color:var(--text)">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="seg">${[['EX','出口'],['IM','进口']].map(d=>`<span class="${TRY.dir===d[0]?'on':''}" onclick="TRY.dir='${d[0]}';renderTry()">${d[1]}</span>`).join('')}</div><span class="hint">2026-01 ~ 2026-10 海关数据 · 按完整单词匹配，不区分大小写、忽略标点</span></div>
    ${hit.length?`<div style="font-size:12.5px;margin-bottom:10px">匹配 <b>${cnt(hit)}</b> 条，${only.length?`其中 <b style="color:var(--amber)">${cnt(only)}</b> 条${lab}`:(TRY.isNew?'现有写法均能查到':'其他写法均能查到')}${hsOff.length?`；${cnt(hsOff)} 条HS编码不是 ${esc(E.hs)}`:''}</div>
    <div class="tblwrap" style="margin:0;max-height:520px"><table class="t"><thead><tr><th>HS编码</th><th>品名描述</th><th>记录数</th><th>最近月份</th><th></th></tr></thead><tbody>
    ${list.map(o=>`<tr><td>${esc(o.h)}</td><td class="wrap" title="${esc(o.t)}">${esc(clip(o.t,110))}</td><td>${o.n}</td><td>${o.l}</td><td>${only.includes(o)?`<span class="pill new">${lab}</span>`:''}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="muted" style="font-size:12.5px;padding:30px 0;text-align:center">没有匹配到记录</div>'}
  </div>
  <div class="mft"><span class="sp"></span><button class="btn" onclick="closeTry()">关闭</button>${TRY.isNew&&!E.kw.some(k=>same(k.w,w))?'<button class="btn pri" onclick="closeTry();addW()">添加该写法</button>':''}</div>`;
}

/* ---------- 关联环节 ---------- */
let ND=null;
function openNd(){ND={sel:E.nd.slice(),ch:0,t:'',q:''};renderNd();$('nov').classList.add('show')}
function closeNd(){$('nov').classList.remove('show')}
function otherOf(id){return PROD.filter((x,i)=>i!==EI&&(x.nd||[]).includes(id)).map(x=>x.p)}
function renderNd(){
  const [cn,ns]=CHAINS[ND.ch];const types=[...new Set(ns.map(n=>n[2]))];const q=ND.q.toLowerCase();
  const list=ns.filter(n=>(!ND.t||n[2]===ND.t)&&(!q||n[1].toLowerCase().includes(q)));
  $('nbox').innerHTML=`<div class="mhd"><h3>关联环节</h3><div class="mx" onclick="closeNd()">✕</div></div>
  <div class="ndw">
    <div class="ndl">${CHAINS.map((c,i)=>{const k=c[1].filter(n=>ND.sel.includes(n[0])).length;return `<div class="${i===ND.ch?'on':''}" onclick="ND.ch=${i};ND.t='';renderNd()">${esc(c[0])}${k?`<span class="bd">${k}</span>`:''}</div>`}).join('')}</div>
    <div class="ndr">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div class="search" style="width:300px;height:34px"><span style="color:var(--text3)">🔍</span><input id="ndQ" placeholder="搜索环节" value="${esc(ND.q)}" oninput="ND.q=this.value;renderNd();const i=$('ndQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)"></div>
        <select class="fsel" style="height:34px" onchange="ND.t=this.value;renderNd()"><option value="">全部类型</option>${types.map(t=>`<option ${ND.t===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="ndlist">${list.map(n=>{const on=ND.sel.includes(n[0]);const o=otherOf(n[0]);return `<label class="ndi"><input type="checkbox" ${on?'checked':''} onchange="ndTog('${n[0]}')"><span class="nm">${esc(n[1])}</span><span class="pill st-off">${n[2]}</span>${o.length?`<span class="muted" style="font-size:11.5px">已关联 ${esc(o.join('、'))}</span>`:''}</label>`}).join('')||'<div class="muted" style="padding:30px;text-align:center">没有匹配的环节</div>'}</div>
    </div>
  </div>
  <div class="mft"><span class="muted" style="font-size:12px">已选 ${ND.sel.length} 个环节</span><span class="sp"></span><button class="btn" onclick="closeNd()">取消</button><button class="btn pri" onclick="E.nd=ND.sel.slice();closeNd();renderEdit()">确定</button></div>`;
}
function ndTog(id){const i=ND.sel.indexOf(id);if(i>=0)ND.sel.splice(i,1);else ND.sel.push(id);renderNd()}

function save(){
  if(!E.p){toast('请填写产品');$('fP').focus();return}
  if(!E.cn){toast('请填写中文名称');$('fC').focus();return}
  if(E.hs&&(E.hs.length<6||E.hs.length>10)){toast('HS编码请填写6~10位数字');$('fH').focus();return}
  if(PROD.some((x,i)=>i!==EI&&same(x.p,E.p))){toast('产品已存在');return}
  if(!E.kw.length){toast('请至少添加一种品名写法');$('fW').focus();return}
  E.by='营销中心';E.t=now();
  if(EI==null)PROD.unshift(E);else PROD[EI]=E;
  closeEdit();render();toast('已保存');
}
/* ---------- 停用 / 删除 ---------- */
function confirmBox(t,b,ok,cb){$('ct').textContent=t;$('cb').innerHTML=b;$('cok').textContent=ok;$('cok').onclick=()=>{closeC();cb()};$('cov').classList.add('show')}
function closeC(){$('cov').classList.remove('show')}
function setSt(i,s){PROD[i].st=s;PROD[i].by='营销中心';PROD[i].t=now();render();toast('已'+s)}
function askStop(i){confirmBox('停用产品',`确认停用「<b style="color:var(--text)">${esc(PROD[i].p)}</b>」？停用后查询时不再显示该产品，可再次启用。`,'确认停用',()=>setSt(i,'停用'))}
function askDel(i){const x=PROD[i];confirmBox('删除产品',`确认删除「<b style="color:var(--text)">${esc(x.p)}</b>」及其 ${x.kw.length} 种品名写法？删除后不可恢复。`,'确认删除',()=>{PROD.splice(i,1);render();toast('已删除')})}
render();
</script>
</body>
</html>
