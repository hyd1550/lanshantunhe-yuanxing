<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>月度出口数据维护</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#f0efe9;--border:#e2e0da;--border2:#c8c6bc;
  --text:#1a1a18;--text2:#6b6960;--text3:#9c9a90;
  --blue:#185FA5;--blue-bg:#E6F1FB;--teal:#0F6E56;--teal-bg:#E1F5EE;
  --amber:#8A5A0B;--amber-bg:#FAEEDA;--green:#27500A;--green-bg:#EAF3DE;--red:#A32D2D;--red-bg:#FCEBEB;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
.app{width:1660px;height:990px;background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;position:relative}

.tbar{flex-shrink:0;height:50px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--bg);border-bottom:1px solid var(--border)}
.crumb{font-size:12.5px;color:var(--text3)}
.crumb b{color:var(--text);font-weight:600;font-size:14px}
.sp{flex:1}
.roview{font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:99px;padding:3px 10px}

.tools{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:14px 22px 10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);width:320px}
.search input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;background:transparent;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:12.5px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{opacity:.9}
.btn.dang{background:#FCEBEB;color:#A32D2D;border-color:#e8c4c4}
.btn.dang:hover{background:#f7dede}

.tblwrap{overflow:auto;margin:0 22px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.pager{display:flex;align-items:center;gap:6px;margin:0 22px 16px;font-size:12.5px}
.pager .psp{flex:1}
.pg-info{color:var(--text3)}
.pg{min-width:30px;height:30px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer}
.pg:hover{background:var(--bg2)}
.pg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg.dis{color:var(--text3);cursor:default;background:var(--bg2)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:16px 22px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
table.t thead th{position:sticky;top:0;background:var(--bg2);color:var(--text2);font-weight:600;font-size:11.5px;z-index:1}
table.t tbody tr:hover{background:var(--bg2)}
table.t tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
.idx{color:var(--text3);width:70px}
.act{color:var(--blue);cursor:pointer;margin-right:14px}
.act:hover{text-decoration:underline}
.act.off{color:var(--red)}
.muted{color:var(--text3)}
.cname{font-weight:500}

.ov{position:absolute;inset:0;background:rgba(20,25,35,.5);display:none;align-items:center;justify-content:center;z-index:60}
.ov.show{display:flex}
.modal{background:var(--bg);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;max-height:88%;width:480px}
.mhd{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border)}
.mhd h3{font-size:15px;font-weight:600;flex:1}
.mx{cursor:pointer;color:var(--text2);width:28px;height:28px;border:1px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center}
.mbody{overflow-y:auto;padding:16px 20px}
.mft{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.fr{margin-bottom:14px}
.fr label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.fr label i{color:var(--red);font-style:normal;margin-right:3px}
.fr input{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.fr input:focus{border-color:var(--blue)}
.fr .unit{font-size:11.5px;color:var(--text3);margin-left:4px}
.ferr{font-size:11.5px;color:var(--red);margin-top:4px;display:none}
.ferr.show{display:block}
.dupbox{background:var(--red-bg);border:1px solid #e8c4c4;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--red);line-height:1.7;margin-bottom:12px;display:none}
.dupbox.show{display:block}
.dupbox a{color:var(--blue);cursor:pointer;text-decoration:underline}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 16px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="tbar">
    <b class="crumb"><b>月度出口数据维护</b></b>
    <span class="sp"></span>
    <span class="roview">仅统一管理员可维护</span>
  </div>

  <div class="tools">
    <div class="search"><span style="color:var(--text3)">🔍</span><input id="q" placeholder="搜索出口国家 / 出口年月…" oninput="resetPage()"></div>
    <span class="sp"></span>
    <button class="btn pri" onclick="openAdd()">＋ 新增</button>
  </div>

  <div class="tblwrap">
    <table class="t">
      <thead><tr>
        <th class="idx">序号</th>
        <th>出口国家</th>
        <th class="num">出口数量（吨）</th>
        <th class="num">出口金额（万元）</th>
        <th>出口年月</th>
        <th>填报时间</th>
        <th>操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>

  <!-- 新增 / 编辑 -->
  <div class="ov" id="formov"><div class="modal">
    <div class="mhd"><h3 id="formTitle">新增出口数据</h3><div class="mx" onclick="closeForm()">✕</div></div>
    <div class="mbody">
      <div class="dupbox" id="dupbox"></div>
      <div class="fr">
        <label><i>*</i>出口国家</label>
        <input id="fCountry" placeholder="请输入出口国家 / 地区名称">
        <div class="ferr" id="eCountry">请填写出口国家</div>
      </div>
      <div class="fr">
        <label><i>*</i>出口数量<span class="unit">单位：吨</span></label>
        <input id="fQty" type="number" min="0" step="0.01" placeholder="请输入出口数量">
        <div class="ferr" id="eQty">请填写出口数量（数值，不小于 0）</div>
      </div>
      <div class="fr">
        <label><i>*</i>出口金额<span class="unit">单位：万元</span></label>
        <input id="fAmt" type="number" min="0" step="0.01" placeholder="请输入出口金额">
        <div class="ferr" id="eAmt">请填写出口金额（数值，不小于 0）</div>
      </div>
      <div class="fr">
        <label><i>*</i>出口年月</label>
        <input id="fYm" type="month">
        <div class="ferr" id="eYm">请选择出口年月</div>
      </div>
    </div>
    <div class="mft"><span class="sp"></span><button class="btn" onclick="closeForm()">关闭</button><button class="btn pri" onclick="saveForm()">确定</button></div>
  </div></div>

  <!-- 删除确认 -->
  <div class="ov" id="delov"><div class="modal" style="width:420px">
    <div class="mhd"><h3>删除出口数据</h3><div class="mx" onclick="closeDel()">✕</div></div>
    <div class="mbody"><p style="font-size:13px;line-height:1.7;color:var(--text2)">确认删除「<b id="delname" style="color:var(--text)"></b>」这条记录？<br>删除后不可恢复，驾驶舱「企业概览」出口概览的统计将同步更新。</p></div>
    <div class="mft"><span class="sp"></span><button class="btn" onclick="closeDel()">取消</button><button class="btn dang" onclick="confirmDel()">确认删除</button></div>
  </div></div>

  <div class="toast" id="toast"></div>
</div>

<script>
let seq = 1;
const R = (country, qty, amt, ym, filled) => ({ id: 'r' + (seq++), country, qty, amt, ym, filled });
let rows = [
  R('越南', 1420, 2486, '2026-06', '2026-07-03 09:18'),
  R('印度尼西亚', 1180, 2065, '2026-06', '2026-07-03 09:22'),
  R('泰国', 960, 1690, '2026-06', '2026-07-03 09:25'),
  R('日本', 820, 1509, '2026-06', '2026-07-03 09:30'),
  R('韩国', 760, 1368, '2026-06', '2026-07-03 09:33'),
  R('德国', 540, 1026, '2026-06', '2026-07-03 09:36'),
  R('荷兰', 480, 912, '2026-06', '2026-07-03 09:40'),
  R('美国', 390, 764, '2026-06', '2026-07-03 09:44'),
  R('越南', 1360, 2380, '2026-05', '2026-06-04 10:05'),
  R('印度尼西亚', 1105, 1933, '2026-05', '2026-06-04 10:09'),
  R('泰国', 915, 1610, '2026-05', '2026-06-04 10:12'),
  R('日本', 780, 1435, '2026-05', '2026-06-04 10:16'),
  R('韩国', 725, 1305, '2026-05', '2026-06-04 10:19'),
  R('德国', 510, 969, '2026-05', '2026-06-04 10:23'),
  R('荷兰', 455, 865, '2026-05', '2026-06-04 10:27'),
  R('越南', 1290, 2257, '2026-04', '2026-05-06 09:12'),
  R('印度尼西亚', 1042, 1823, '2026-04', '2026-05-06 09:15'),
  R('泰国', 870, 1531, '2026-04', '2026-05-06 09:19'),
  R('日本', 742, 1365, '2026-04', '2026-05-06 09:23'),
  R('韩国', 690, 1242, '2026-04', '2026-05-06 09:26'),
  R('意大利', 420, 798, '2026-04', '2026-05-06 09:31'),
  R('越南', 1215, 2126, '2026-03', '2026-04-07 14:02'),
  R('印度尼西亚', 985, 1723, '2026-03', '2026-04-07 14:06'),
  R('泰国', 825, 1452, '2026-03', '2026-04-07 14:10'),
  R('日本', 705, 1297, '2026-03', '2026-04-07 14:14'),
  R('马来西亚', 560, 1008, '2026-03', '2026-04-07 14:18'),
  R('越南', 880, 1540, '2026-02', '2026-03-05 11:20'),
  R('印度尼西亚', 715, 1251, '2026-02', '2026-03-05 11:24'),
  R('泰国', 600, 1056, '2026-02', '2026-03-05 11:28'),
  R('日本', 512, 942, '2026-02', '2026-03-05 11:32'),
  R('越南', 1150, 2013, '2026-01', '2026-02-04 09:40'),
  R('印度尼西亚', 930, 1628, '2026-01', '2026-02-04 09:44'),
  R('泰国', 780, 1373, '2026-01', '2026-02-04 09:48'),
  R('日本', 668, 1229, '2026-01', '2026-02-04 09:52'),
  R('西班牙', 345, 656, '2026-01', '2026-02-04 09:56'),
];

const pageSize = 15;
let page = 1, editId = null, delId = null;

function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1900); }
function fmt(n){ return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2}); }
function resetPage(){ page=1; render(); }
function gotoPage(p){ page=p; render(); }

function renderPager(total, pages){
  let nums=''; for(let i=1;i<=pages;i++) nums+=`<span class="pg${i===page?' on':''}" onclick="gotoPage(${i})">${i}</span>`;
  document.getElementById('pager').innerHTML=
    `<span class="pg-info">共 ${total} 条，每页 ${pageSize} 条</span><span class="psp"></span>`+
    `<span class="pg${page<=1?' dis':''}" ${page<=1?'':`onclick="gotoPage(${page-1})"`}>上一页</span>${nums}`+
    `<span class="pg${page>=pages?' dis':''}" ${page>=pages?'':`onclick="gotoPage(${page+1})"`}>下一页</span>`;
}

function sorted(){
  return rows.slice().sort((a,b)=> a.ym===b.ym ? b.qty-a.qty : b.ym.localeCompare(a.ym));
}

function render(){
  const q=document.getElementById('q').value.trim();
  const list=sorted().filter(x=> !q || x.country.includes(q) || x.ym.includes(q));
  const total=list.length, pages=Math.max(1,Math.ceil(total/pageSize));
  if(page>pages) page=pages; if(page<1) page=1;
  const start=(page-1)*pageSize, slice=list.slice(start,start+pageSize);
  renderPager(total,pages);
  document.getElementById('tbody').innerHTML = slice.map((x,i)=>`
    <tr>
      <td class="idx">${String(start+i+1).padStart(2,'0')}</td>
      <td class="cname">${x.country}</td>
      <td class="num">${fmt(x.qty)}</td>
      <td class="num">${fmt(x.amt)}</td>
      <td>${x.ym.replace('-','年')}月</td>
      <td class="muted">${x.filled}</td>
      <td>
        <span class="act" onclick="openEdit('${x.id}')">编辑</span>
        <span class="act off" onclick="askDel('${x.id}')">删除</span>
      </td>
    </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:40px">无匹配的出口数据记录</td></tr>`;
}

/* 新增 / 编辑 */
function clearErr(){ ['eCountry','eQty','eAmt','eYm'].forEach(id=>document.getElementById(id).classList.remove('show')); document.getElementById('dupbox').classList.remove('show'); }
function openAdd(){
  editId=null; clearErr();
  document.getElementById('formTitle').textContent='新增出口数据';
  document.getElementById('fCountry').value='';
  document.getElementById('fQty').value='';
  document.getElementById('fAmt').value='';
  document.getElementById('fYm').value='';
  document.getElementById('formov').classList.add('show');
}
function openEdit(id){
  const x=rows.find(r=>r.id===id); if(!x) return;
  editId=id; clearErr();
  document.getElementById('formTitle').textContent='编辑出口数据';
  document.getElementById('fCountry').value=x.country;
  document.getElementById('fQty').value=x.qty;
  document.getElementById('fAmt').value=x.amt;
  document.getElementById('fYm').value=x.ym;
  document.getElementById('formov').classList.add('show');
}
function closeForm(){ document.getElementById('formov').classList.remove('show'); }
function jumpEdit(id){ closeForm(); setTimeout(()=>openEdit(id),120); }

function saveForm(){
  clearErr();
  const country=document.getElementById('fCountry').value.trim();
  const qtyStr=document.getElementById('fQty').value.trim();
  const amtStr=document.getElementById('fAmt').value.trim();
  const ym=document.getElementById('fYm').value;
  let bad=false;
  if(!country){ document.getElementById('eCountry').classList.add('show'); bad=true; }
  if(qtyStr===''||isNaN(Number(qtyStr))||Number(qtyStr)<0){ document.getElementById('eQty').classList.add('show'); bad=true; }
  if(amtStr===''||isNaN(Number(amtStr))||Number(amtStr)<0){ document.getElementById('eAmt').classList.add('show'); bad=true; }
  if(!ym){ document.getElementById('eYm').classList.add('show'); bad=true; }
  if(bad) return;

  // 同一出口国家 + 同一年月 唯一
  const dup=rows.find(r=>r.country===country && r.ym===ym && r.id!==editId);
  if(dup){
    const box=document.getElementById('dupbox');
    box.innerHTML=`「${country}」${ym.replace('-','年')}月 已存在一条记录，同一国家同一年月只能保留一条。<br>请前往 <a onclick="jumpEdit('${dup.id}')">编辑该条记录</a>，或修改国家 / 年月后重新保存。`;
    box.classList.add('show');
    return;
  }

  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  if(editId){
    const x=rows.find(r=>r.id===editId);
    x.country=country; x.qty=Number(qtyStr); x.amt=Number(amtStr); x.ym=ym; x.filled=stamp;
    closeForm(); render(); toast('已保存');
  }else{
    rows.push(R(country, Number(qtyStr), Number(amtStr), ym, stamp));
    closeForm(); page=1; render(); toast('已新增 1 条记录');
  }
}

/* 删除 */
function askDel(id){
  const x=rows.find(r=>r.id===id); if(!x) return;
  delId=id;
  document.getElementById('delname').textContent=`${x.country} ${x.ym.replace('-','年')}月`;
  document.getElementById('delov').classList.add('show');
}
function closeDel(){ document.getElementById('delov').classList.remove('show'); }
function confirmDel(){ rows=rows.filter(r=>r.id!==delId); closeDel(); render(); toast('已删除'); }

render();
</script>
</body>
</html>
