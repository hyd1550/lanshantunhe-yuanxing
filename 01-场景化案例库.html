<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>场景化案例库</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f7fa;--bg3:#eef1f5;--border:#e4e8ee;--border2:#cfd6e0;
 --text:#1d2129;--text2:#5b6472;--text3:#98a1af;--blue:#1B62C4;--blue-bg:#EAF2FE;
 --green:#0F7B4A;--green-bg:#E6F6EE;--amber:#8A5A0B;--amber-bg:#FDF2DE;--red:#C0392B;--red-bg:#FDECEA}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
.app{width:1660px;height:990px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg2)}
.tbar{flex-shrink:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--bg);border-bottom:1px solid var(--border)}
.tbar .bar{width:3px;height:15px;background:var(--blue);border-radius:2px}
.ttl{font-size:15px;font-weight:600}.sp{flex:1}
.tip{font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:99px;padding:4px 12px}
.tools{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:14px 22px 8px;flex-wrap:wrap;background:var(--bg);border-bottom:1px solid var(--border)}
.lb{font-size:12.5px;color:var(--text2);white-space:nowrap}
.fsel,.finp{height:34px;padding:0 10px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);font-family:inherit;font-size:12.5px;color:var(--text);outline:none}
.finp{width:230px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;font-size:12.5px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.pri:hover{opacity:.9}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.dang{background:var(--red-bg);color:var(--red);border-color:#f0c8c3}
.body{flex:1;overflow-y:auto;padding:16px 22px}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.p-on{background:var(--green-bg);color:var(--green)}
.p-draft{background:var(--amber-bg);color:var(--amber)}
.p-off{background:var(--bg3);color:var(--text3)}
.p-scene{background:var(--blue-bg);color:var(--blue)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--bg);border-radius:8px;overflow:hidden}
table.t th,table.t td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border)}
table.t thead th{background:#fafbfc;color:var(--text2);font-weight:600;font-size:11.5px;white-space:nowrap}
table.t tbody tr:hover{background:#fafbfd}
table.t tr:last-child td{border-bottom:none}
.act{color:var(--blue);cursor:pointer;margin-right:12px;font-size:12.5px}
.act:hover{text-decoration:underline}
.act.del{color:var(--red)}.act.off{color:var(--text2)}
.pager{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px}
.pg-info{color:var(--text3);margin-right:auto}
.pg{min-width:30px;height:30px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:6px;background:var(--bg);cursor:pointer}
.pg:hover{border-color:var(--blue);color:var(--blue)}
.pg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg.dis{color:var(--text3);cursor:default;background:var(--bg2)}
.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;padding:9px 17px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--text2);background:var(--blue-bg);border-left:3px solid var(--blue);border-radius:4px;padding:9px 13px;line-height:1.6;margin-bottom:14px}
.filters2{display:flex;align-items:center;gap:10px;padding:0 22px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.fchip{display:flex;align-items:center;gap:6px;background:var(--blue-bg);border:1px solid #c3dbfb;border-radius:6px;padding:4px 6px 4px 10px;font-size:12px;color:var(--blue)}
.fchip select{border:none;background:transparent;font-size:12px;color:var(--blue);font-family:inherit;outline:none;font-weight:500}
.dyn-hint{font-size:11.5px;color:var(--text3)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cd{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.cd:hover{border-color:var(--blue);box-shadow:0 3px 12px rgba(27,98,196,.10)}
.cd .cover{height:150px;background:linear-gradient(135deg,#dde6f2,#c2d5ea);display:flex;align-items:center;justify-content:center;color:#7f93ad;font-size:12px;position:relative}
.cd .cover .st{position:absolute;top:9px;right:9px}
.cd .bd{padding:12px 14px;flex:1;display:flex;flex-direction:column}
.cd .h{font-size:13.5px;font-weight:600;line-height:1.5;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd .s{font-size:12px;color:var(--text2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:9px;flex:1}
.cd .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tg{font-size:11px;background:var(--bg3);color:var(--text2);border-radius:4px;padding:2px 7px}
.cd .ft{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text3);border-top:1px solid var(--border);padding-top:9px}
.vsw{display:flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.vsw span{padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--text2);background:var(--bg)}
.vsw span.on{background:var(--blue);color:#fff}</style></head><body>
<div class="app">
  <div class="tbar"><span class="bar"></span><span class="ttl">场景化案例库</span>
  </div>
  <div class="tools">
    <span class="lb">应用场景</span>
    <select class="fsel" id="fsc" onchange="onScene()" style="width:170px"><option value="">全部场景</option><option>农业园艺（农膜）</option><option>包装产业</option><option>母婴用品</option><option>日用消费品</option><option>纺织纤维与鞋服</option><option>一次性医用耗材</option><option>3D打印</option><option>防沙环保</option><option>轻量化应用</option><option>渔牧业</option><option>电子产品</option></select>
    <span class="lb">关键字</span>
    <input class="finp" id="q" placeholder="案例名称 / 摘要关键词" oninput="render()">
    <button class="btn pri" onclick="render()">搜索</button>
    <button class="btn" onclick="reset()">重置</button>
    <span class="sp"></span>
    <div class="vsw"><span id="v1" class="on" onclick="setView('card')">卡片</span><span id="v2" onclick="setView('list')">列表</span></div>
  </div>
  <div class="filters2" id="dynFilters"></div>
  <div class="body">
    <div id="stat" style="font-size:12.5px;color:var(--text3);margin-bottom:12px"></div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const CASES=[{"id": 1, "t": "新疆昌吉-7801系列-地膜-玉米栽培应用案例", "sc": "农业园艺（农膜）", "p": "7801-系列-MF-2023", "u": "王某", "d": "2026-05-12", "st": "已发布", "sum": "采用全膜双垄沟播覆盖方式，配合膜下滴灌技术，玉米生育期 180 天，亩产较普通地膜提升 8.5%，地膜 300 天完成降解。", "meta": {"区域": "新疆·昌吉", "作物品种": "玉米-先玉335", "土种类型": "黄绵土", "地形": "高原"}}, {"id": 2, "t": "甘肃张掖-7801系列-地膜-马铃薯覆膜案例", "sc": "农业园艺（农膜）", "p": "7801-系列-MF-2023", "u": "王某", "d": "2026-04-28", "st": "已发布", "sum": "针对西北干旱区设计，保温性与耐候性达 180 天以上，马铃薯出苗率提升明显，残膜可自然降解、无需回收。", "meta": {"区域": "甘肃·张掖", "作物品种": "马铃薯-青薯9号", "土种类型": "灰钙土", "地形": "平原"}}, {"id": 3, "t": "云南曲靖-7803系列-地膜-烟草种植案例", "sc": "农业园艺（农膜）", "p": "7803-系列-MF-2024", "u": "李某", "d": "2026-04-10", "st": "已发布", "sum": "高原红壤区烟草覆膜应用，透光率与流滴性满足高湿环境要求，降解周期与烟草生长周期匹配良好。", "meta": {"区域": "云南·曲靖", "作物品种": "烟草-K326", "土种类型": "红壤", "地形": "山地"}}, {"id": 4, "t": "山东寿光-可降解购物袋-商超应用案例", "sc": "包装产业", "p": "7081型购物袋", "u": "赵某", "d": "2026-03-22", "st": "已发布", "sum": "替代传统 PE 购物袋，承重 5kg 无破损，符合 GB/T 38082 标准，商超反馈良好。", "meta": {"区域": "山东·潍坊", "规格尺寸": "320×450mm", "降解周期": "180天"}}, {"id": 5, "t": "江苏南通-可降解快递包装袋应用案例", "sc": "包装产业", "p": "7085型快递袋", "u": "赵某", "d": "2026-03-05", "st": "已发布", "sum": "电商快递场景，抗撕裂性能提升，适配自动化分拣设备，已在区域快递网点批量投用。", "meta": {"区域": "江苏·南通", "规格尺寸": "280×420mm", "降解周期": "180天"}}, {"id": 6, "t": "广东东莞-可降解湿巾基材应用案例", "sc": "母婴用品", "p": "TH-NW-2025", "u": "李某", "d": "2026-02-18", "st": "已发布", "sum": "母婴级无纺布基材，通过食品接触级检测，柔软度与湿强度满足婴儿湿巾要求。", "meta": {"区域": "广东·东莞", "安全等级": "母婴级", "适用月龄": "0-3岁"}}, {"id": 7, "t": "浙江义乌-可降解吸管-餐饮渠道应用案例", "sc": "日用消费品", "p": "TH-ST-2025", "u": "周某", "d": "2026-01-20", "st": "已发布", "sum": "耐温型结晶吸管，热饮场景不软化，已在连锁茶饮门店推广使用。", "meta": {"区域": "浙江·金华", "规格": "直径12mm", "材质": "PBAT/PLA"}}, {"id": 8, "t": "内蒙古赤峰-7802系列-地膜-向日葵案例", "sc": "农业园艺（农膜）", "p": "7802-系列-MF-2024", "u": "王某", "d": "2026-01-08", "st": "草稿", "sum": "（草稿）内蒙古东部风沙区向日葵覆膜试验，抗风性能测试中。", "meta": {"区域": "内蒙古·赤峰", "作物品种": "向日葵-三瑞3号", "土种类型": "栗钙土", "地形": "平原"}}, {"id": 9, "t": "河北邯郸-可降解地膜-棉花种植案例（旧）", "sc": "农业园艺（农膜）", "p": "7800-系列-MF-2022", "u": "李某", "d": "2025-11-15", "st": "已下架", "sum": "（已下架）产品已迭代，该案例参数不再适用，保留供历史参考。", "meta": {"区域": "河北·邯郸", "作物品种": "棉花", "土种类型": "潮土", "地形": "平原"}}], TPL={"农业园艺（农膜）": [{"n": "方案图片", "items": [["上传图片", "图片", false, true]]}, {"n": "案例概述", "items": [["案例背景说明", "文本域", false, false]]}, {"n": "农膜产品信息", "items": [["农膜型号（牌号）", "文本", true, true], ["材质", "文本", false, true], ["厚度", "文本", false, true], ["透光率", "文本", false, true], ["保温性", "文本", false, true], ["流滴性", "文本", false, true], ["消雾性", "文本", false, true], ["覆盖方式", "文本", false, true], ["使用周期", "文本", false, true]]}, {"n": "适配土壤信息", "items": [["地形", "文本", false, true], ["土种类型", "文本", false, true], ["土壤酸碱度（PH值）范围", "文本", false, true], ["有机质含量", "文本", false, true], ["土壤质地", "文本", false, true], ["肥力状况", "文本", false, true]]}, {"n": "作物信息", "items": [["作物品种", "文本", true, true], ["生育期", "文本", false, true], ["种植密度", "文本", false, true], ["主要栽培管理措施", "多段文本", false, true]]}, {"n": "气候环境参数", "items": [["年平均气温", "文本", false, true], ["极端高温/低温", "文本", false, true], ["年降水量", "文本", false, true], ["日照时数", "文本", false, true], ["主要风向", "文本", false, true]]}, {"n": "应用效果", "items": [["效果描述", "多段文本", false, true], ["检测报告", "文件", false, true]]}], "包装产业": [{"n": "方案图片", "items": [["上传图片", "图片", false, true]]}, {"n": "包装产品信息", "items": [["产品型号", "文本", true, true], ["材质", "文本", false, true], ["规格尺寸", "文本", false, true], ["厚度", "文本", false, true], ["承重", "文本", false, true], ["降解周期", "文本", false, true]]}, {"n": "应用效果", "items": [["效果描述", "多段文本", false, true], ["检测报告", "文件", false, true]]}], "母婴用品": [{"n": "方案图片", "items": [["上传图片", "图片", false, true]]}, {"n": "产品信息", "items": [["产品型号", "文本", true, true], ["材质", "文本", false, true], ["安全等级", "文本", false, true], ["适用月龄", "文本", false, true]]}], "日用消费品": [{"n": "方案图片", "items": [["上传图片", "图片", false, true]]}, {"n": "产品信息", "items": [["产品型号", "文本", true, true], ["材质", "文本", false, true], ["规格", "文本", false, true]]}]};
const DYN={'农业园艺（农膜）':['区域','作物品种','土种类型','地形'],'包装产业':['区域','规格尺寸','降解周期'],
           '母婴用品':['区域','安全等级','适用月龄'],'日用消费品':['区域','规格','材质']};
let view='card', page=1, dyn={};
const PER=6;
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)}
function setView(v){view=v;document.getElementById('v1').className=(v==='card'?'on':'');document.getElementById('v2').className=(v==='list'?'on':'');render()}
function reset(){document.getElementById('fsc').value='';document.getElementById('q').value='';dyn={};onScene()}
function uniq(sc,k){const s=new Set();CASES.forEach(c=>{if((!sc||c.sc===sc)&&c.meta[k])s.add(c.meta[k])});return [...s]}
function onScene(){
  const sc=document.getElementById('fsc').value; dyn={};
  const keys=DYN[sc]||[];
  const box=document.getElementById('dynFilters');
  if(!sc){box.innerHTML='';}
  else if(!keys.length){box.innerHTML='<span class="dyn-hint">该场景暂未配置可筛选的结构化字段</span>';}
  else{
    box.innerHTML='<span class="lb" style="color:var(--blue);font-weight:600">按案例参数筛选：</span>'+keys.map(k=>
      '<span class="fchip">'+k+'<select onchange="setDyn(\''+k+'\',this.value)"><option value="">不限</option>'+
      uniq(sc,k).map(v=>'<option>'+v+'</option>').join('')+'</select></span>').join('')+
      '<span class="dyn-hint">（筛选项来自「案例模板维护」中该场景配置的指标项）</span>';
  }
  page=1;render();
}
function setDyn(k,v){if(v)dyn[k]=v;else delete dyn[k];page=1;render()}
function filtered(){
  const sc=document.getElementById('fsc').value, q=(document.getElementById('q').value||'').trim();
  return CASES.filter(c=>{
    if(c.st!=='已发布')return false;
    if(sc&&c.sc!==sc)return false;
    if(q&&c.t.indexOf(q)<0&&c.sum.indexOf(q)<0)return false;
    for(const k in dyn){if(c.meta[k]!==dyn[k])return false}
    return true;
  });
}
function render(){
  const rows=filtered(), tot=Math.max(1,Math.ceil(rows.length/PER));
  if(page>tot)page=tot;
  const slice=rows.slice((page-1)*PER,page*PER);
  document.getElementById('stat').textContent='共找到 '+rows.length+' 个案例'+(Object.keys(dyn).length?'（已按 '+Object.keys(dyn).join('、')+' 筛选）':'');
  const L=document.getElementById('list');
  if(!slice.length){L.innerHTML='<div style="text-align:center;color:var(--text3);padding:70px 0;background:var(--bg);border-radius:10px">未找到符合条件的案例，请调整筛选条件</div>';}
  else if(view==='card'){
    L.innerHTML='<div class="cards">'+slice.map(c=>
      '<div class="cd" onclick="toast(\'打开案例详情：'+c.t+'\')">'+
      '<div class="cover">方案图片</div>'+
      '<div class="bd"><div class="h">'+c.t+'</div><div class="s">'+c.sum+'</div>'+
      '<div class="tags"><span class="pill p-scene">'+c.sc+'</span>'+
        Object.keys(c.meta).slice(0,3).map(k=>'<span class="tg">'+k+'：'+c.meta[k]+'</span>').join('')+'</div>'+
      '<div class="ft"><span>产品：'+c.p+'</span><span class="sp"></span><span>'+c.u+'</span><span>'+c.d+'</span></div>'+
      '</div></div>').join('')+'</div>';
  } else {
    L.innerHTML='<table class="t"><thead><tr><th style="width:46px;text-align:center">序号</th><th>案例名称</th>'+
      '<th style="width:140px">应用场景</th><th style="width:150px">产品名称</th><th style="width:230px">关键参数</th>'+
      '<th style="width:80px">上传人</th><th style="width:100px">上传时间</th><th style="width:80px">操作</th></tr></thead><tbody>'+
      slice.map((c,i)=>'<tr><td style="text-align:center;color:var(--text3)">'+((page-1)*PER+i+1)+'</td>'+
      '<td style="font-weight:500">'+c.t+'</td><td><span class="pill p-scene">'+c.sc+'</span></td><td>'+c.p+'</td>'+
      '<td style="color:var(--text2);font-size:12px">'+Object.keys(c.meta).slice(0,2).map(k=>k+'：'+c.meta[k]).join('；')+'</td>'+
      '<td>'+c.u+'</td><td style="color:var(--text2)">'+c.d+'</td>'+
      '<td><span class="act" onclick="toast(\'打开案例详情\')">查看</span></td></tr>').join('')+'</tbody></table>';
  }
  let h='<span class="pg-info">共 '+rows.length+' 条 · 第 '+page+'/'+tot+' 页</span>';
  h+='<span class="pg '+(page<=1?'dis':'')+'" onclick="go('+(page-1)+')">‹</span>';
  for(let i=1;i<=tot;i++)h+='<span class="pg '+(i===page?'on':'')+'" onclick="go('+i+')">'+i+'</span>';
  h+='<span class="pg '+(page>=tot?'dis':'')+'" onclick="go('+(page+1)+')">›</span>';
  document.getElementById('pager').innerHTML=h;
}
function go(p){const tot=Math.max(1,Math.ceil(filtered().length/PER));if(p<1||p>tot)return;page=p;render()}
onScene();
</script></body></html>
