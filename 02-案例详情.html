<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>案例详情</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f7fa;--bg3:#eef1f5;--border:#e4e8ee;--border2:#cfd6e0;
 --text:#1d2129;--text2:#5b6472;--text3:#98a1af;--blue:#1B62C4;--blue-bg:#EAF2FE;
 --green:#0F7B4A;--green-bg:#E6F6EE;--amber:#8A5A0B;--amber-bg:#FDF2DE;--red:#C0392B;--red-bg:#FDECEA}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
.app{width:1660px;height:990px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg2)}
.tbar{flex-shrink:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--bg);border-bottom:1px solid var(--border)}
.tbar .bar{width:3px;height:15px;background:var(--blue);border-radius:2px}
.ttl{font-size:15px;font-weight:600}.sp{flex:1}
.back{font-size:12.5px;color:var(--blue);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.back:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:12.5px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.pri:hover{opacity:.9}
.btn.dang{background:var(--red-bg);color:var(--red);border-color:#f0c8c3}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap;display:inline-block}
.p-on{background:var(--green-bg);color:var(--green)}
.p-off{background:var(--bg3);color:var(--text3)}
.p-scene{background:var(--blue-bg);color:var(--blue)}
.body{flex:1;overflow-y:auto;padding:16px 22px 26px}
.wrap{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}

/* ---- 案例抬头 ---- */
.hero{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.hero h1{font-size:19px;font-weight:600;line-height:1.45;margin-bottom:10px}
.hero .metas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.hero .abs{font-size:13px;color:var(--text2);line-height:1.75;background:#fafbfc;border-left:3px solid var(--border2);border-radius:4px;padding:10px 14px}

/* ---- 内容卡 ---- */
.card{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.card-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--border)}
.card-hd .bar{width:3px;height:14px;background:var(--blue);border-radius:2px}
.card-hd .n{font-size:13.5px;font-weight:600}
.card-bd{padding:16px 18px}

/* 文本指标：两列描述列表 */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 30px}
.dl .d{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);min-width:0}
.dl .d .k{flex:0 0 132px;color:var(--text2);font-size:12.5px;line-height:1.7}
.dl .d .v{flex:1;font-size:13px;line-height:1.7;word-break:break-all}
.dl .d .v.empty{color:var(--text3)}
.dl .d.full{grid-column:1/-1}

/* 多段文本 */
.para{padding:4px 0 10px}
.para .pk{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.para .pk::before{content:'';width:3px;height:12px;background:var(--border2);border-radius:2px}
.para .pv{font-size:13px;line-height:1.9;color:var(--text);white-space:pre-wrap}
.para.notitle .pv{color:var(--text)}

/* 图片组 */
.gal{display:flex;gap:12px;flex-wrap:wrap}
.gal .im{width:216px;height:150px;border-radius:8px;background:linear-gradient(135deg,#dde6f2,#c9d8ea);display:flex;align-items:center;justify-content:center;color:#7f93ad;font-size:12px;cursor:zoom-in;position:relative;border:1px solid var(--border)}
.gal .im:hover{border-color:var(--blue)}
.gal .im .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(29,33,41,.62);color:#fff;font-size:11.5px;padding:5px 8px;border-radius:0 0 7px 7px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 文件列表 */
.files{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--border);border-radius:7px;background:#fafbfc}
.fi .ico{width:30px;height:30px;border-radius:6px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.fi .fn{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .fs{font-size:11.5px;color:var(--text3);flex-shrink:0}
.fi .fa{color:var(--blue);cursor:pointer;font-size:12.5px;flex-shrink:0}
.fi .fa:hover{text-decoration:underline}

/* ---- 右侧栏 ---- */
.side{position:sticky;top:0}
.sc{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.sc-hd{padding:11px 15px;background:#fafbfc;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.sc-bd{padding:13px 15px}
.si{display:flex;gap:10px;padding:7px 0;font-size:12.5px}
.si .k{flex:0 0 76px;color:var(--text2)}
.si .v{flex:1;line-height:1.6}
.rel{display:block;padding:10px 0;border-bottom:1px dashed var(--border);cursor:pointer}
.rel:last-child{border-bottom:none}
.rel .rt{font-size:12.5px;line-height:1.6;margin-bottom:5px}
.rel:hover .rt{color:var(--blue)}
.rel .rm{font-size:11.5px;color:var(--text3)}
.toc a{display:block;padding:7px 0 7px 11px;font-size:12.5px;color:var(--text2);cursor:pointer;border-left:2px solid transparent;text-decoration:none}
.toc a:hover,.toc a.on{color:var(--blue);border-left-color:var(--blue);background:var(--blue-bg)}

.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;padding:9px 17px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--text2);background:var(--blue-bg);border-left:3px solid var(--blue);border-radius:4px;padding:9px 13px;line-height:1.6;margin-bottom:14px;grid-column:1/-1}
/* 灯箱 */
.lb{position:absolute;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:80}
.lb.show{display:flex}
.lb .box{width:820px;height:560px;border-radius:10px;background:linear-gradient(135deg,#dde6f2,#c9d8ea);display:flex;align-items:center;justify-content:center;font-size:15px;color:#6d829c;position:relative}
.lb .cl{position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text)}
.lb .nav.pv{left:-52px}.lb .nav.nx{right:-52px}
</style></head><body>
<div class="app">
  <div class="tbar">
    <span class="bar"></span><span class="ttl">案例详情</span>
    <span class="sp"></span>
    <button class="btn" onclick="toast('导出为 PDF（原型演示）')">导出</button>
    <button class="btn pri" onclick="toast('进入编辑，结构仍由模板决定')">编辑</button>
    <button class="btn dang" onclick="toast('下架后不在案例库展示，可在上传记录中恢复')">下架</button>
  </div>

  <div class="body"><div class="wrap">
    

    <!-- 左：正文 -->
    <div>
      <div class="hero">
        <h1 id="hTtl">新疆昌吉 7801 系列全生物降解地膜 · 玉米大田覆盖栽培应用案例</h1>
        <div class="metas" id="hMeta"></div>
        <div class="abs" id="hAbs">在昌吉回族自治州 320 亩玉米示范田开展全生物降解地膜覆盖试验，与普通 PE 地膜对照。降解膜在铺设后 65 天开始诱导破裂，收获期地表残膜基本消解，出苗率与增温保墒效果与 PE 膜相当，亩均产量差异在 2% 以内，且免去了残膜回收工序。</div>
      </div>
      <div id="secs"></div>
    </div>

    <!-- 右：信息栏 -->
    <div class="side">
      <div class="sc">
        <div class="sc-hd">案例信息</div>
        <div class="sc-bd" id="sInfo"></div>
      </div>
      <div class="sc">
        <div class="sc-hd">栏目导航</div>
        <div class="sc-bd toc" id="sToc" style="padding:8px 10px"></div>
      </div>
    </div>
  </div></div>

  <div class="lb" id="lbox"><div class="box"><span id="lbTxt">方案图 1</span>
    <span class="cl" onclick="closeLb()">×</span>
    <span class="nav pv" onclick="stepLb(-1)">‹</span><span class="nav nx" onclick="stepLb(1)">›</span>
  </div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* ══ 案例数据：结构 = 模板栏目/指标项；值 = 案例填写内容 ══
   指标项：[名称, 类型, 是否显示标题(仅多段文本有效), 值]  */
const CASE={
  title:'新疆昌吉 7801 系列全生物降解地膜 · 玉米大田覆盖栽培应用案例',
  scene:'农业园艺（农膜）', product:'7801-系列-MF-2023', status:'已发布',
  info:[['应用场景','农业园艺（农膜）'],['产品名称','7801-系列-MF-2023'],
        ['上传人','王某（营销中心）'],['上传时间','2025-09-18 14:22']],
  sections:[
    {n:'方案图片', items:[
      ['上传图片','图片',true,['铺膜作业现场（2025-04-12）','出苗期覆盖效果（2025-05-06）','降解中期地表状态（2025-06-20）','收获后地表残留对比（2025-09-02）']]
    ]},
    {n:'案例概述', items:[
      ['案例背景说明','多段文本',false,'昌吉地区玉米种植常年依赖普通 PE 地膜增温保墒，但残膜回收成本高、地块"白色污染"逐年累积，当地已将残膜治理列入农业面源污染整治重点。\n2025 年春播季，选取昌吉市某农业合作社 320 亩连片玉米地作为示范田，采用蓝山屯河 7801 系列全生物降解地膜替代原用 0.01mm PE 地膜，同一地块留设 20 亩 PE 膜对照区，全程跟踪出苗、增温保墒、降解进程与最终产量。']
    ]},
    {n:'农膜产品信息', items:[
      ['农膜型号（牌号）','文本',true,'7801-MF（PBAT/PLA 共混吹塑）'],
      ['材质','文本',true,'PBAT + PLA + 淀粉基填料'],
      ['厚度','文本',true,'0.010 mm ± 0.002'],
      ['透光率','文本',true,'≥ 85%'],
      ['保温性','文本',true,'5cm 地温较露地提高 2.8–3.5 ℃'],
      ['流滴性','文本',true,'流滴期 ≥ 60 天'],
      ['消雾性','文本',true,'—'],
      ['覆盖方式','文本',true,'机械铺膜，膜宽 1.25 m，一膜两行'],
      ['使用周期','文本',true,'覆盖有效期 90–110 天，诱导期约 65 天']
    ]},
    {n:'适配土壤信息', items:[
      ['地形','文本',true,'冲积平原，地势平坦'],
      ['土种类型','文本',true,'灌淤土'],
      ['土壤酸碱度（PH值）范围','文本',true,'7.8 – 8.3（微碱性）'],
      ['有机质含量','文本',true,'14.2 g/kg'],
      ['土壤质地','文本',true,'中壤土'],
      ['肥力状况','文本',true,'中等偏上，基础地力产量约 620 kg/亩']
    ]},
    {n:'作物信息', items:[
      ['作物品种','文本',true,'先玉 335（中晚熟）'],
      ['生育期','文本',true,'128 天'],
      ['种植密度','文本',true,'5800 株/亩'],
      ['主要栽培管理措施','多段文本',true,'播前深松 30cm 并施基肥（尿素 18kg/亩、磷酸二铵 20kg/亩）；\n4 月 12 日机械覆膜播种，膜面覆土压边；\n全生育期滴灌 8 次，随水追肥 3 次；\n拔节期与大喇叭口期各防治一次玉米螟，未使用除草剂膜下喷施。']
    ]},
    {n:'气候环境参数', items:[
      ['年平均气温','文本',true,'7.1 ℃'],
      ['极端高温/低温','文本',true,'38.6 ℃ / −29.4 ℃'],
      ['年降水量','文本',true,'196 mm'],
      ['日照时数','文本',true,'2740 h'],
      ['主要风向','文本',true,'西北风']
    ]},
    {n:'应用效果', items:[
      ['效果描述','多段文本',true,'出苗与保墒：示范区出苗率 94.6%，PE 膜对照区 95.2%，无显著差异；苗期 0–20cm 土壤含水量两者相差 1.2 个百分点。\n降解进程：铺膜后第 65 天膜面出现规则龟裂，第 88 天成片碎裂，收获期（9 月 2 日）地表可见残片面积占比低于 5%，翻耕后无明显条状残膜。\n产量：示范区实收亩产 878 kg，对照区 891 kg，差异 1.5%，在田间试验误差范围内。\n成本：降解膜亩均材料成本较 PE 膜高 21 元，但免去人工与机械捡拾残膜环节（当地约 35–45 元/亩），综合成本反而下降。'],
      ['检测报告','文件',true,[['7801系列地膜生物降解性能检测报告.pdf','PDF','2.4 MB'],['昌吉示范田测产验收报告.docx','DOC','486 KB'],['土壤残膜量检测数据.xlsx','XLS','128 KB']]]
    ]}
  ],
  related:[
    ['甘肃张掖 7801 地膜马铃薯垄作覆盖应用案例','农业园艺（农膜） · 2025-08-30'],
    ['内蒙古赤峰全生物降解地膜甜菜种植应用案例','农业园艺（农膜） · 2025-07-22'],
    ['新疆石河子加厚降解地膜棉花田适配性验证','农业园艺（农膜） · 2025-06-11']
  ]
};

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ── 渲染单个指标项 ── */
function renderItem(it){
  const [name,type,showTitle,val]=it;
  if(type==='图片'){
    const arr=Array.isArray(val)?val:[];
    if(!arr.length) return '<div class="dl"><div class="d full"><div class="k">'+esc(name)+'</div><div class="v empty">—</div></div></div>';
    return '<div class="gal">'+arr.map((c,i)=>
      '<div class="im" onclick="openLb('+i+')">图片 '+(i+1)+'<span class="cap">'+esc(c)+'</span></div>').join('')+'</div>';
  }
  if(type==='文件'){
    const arr=Array.isArray(val)?val:[];
    if(!arr.length) return '<div class="dl"><div class="d full"><div class="k">'+esc(name)+'</div><div class="v empty">—</div></div></div>';
    return '<div class="files">'+arr.map(f=>
      '<div class="fi"><span class="ico">'+esc(f[1])+'</span><span class="fn">'+esc(f[0])+'</span>'+
      '<span class="fs">'+esc(f[2])+'</span>'+
      '<span class="fa" onclick="toast(\'在线预览（原型演示）\')">预览</span>'+
      '<span class="fa" onclick="toast(\'开始下载（原型演示）\')">下载</span></div>').join('')+'</div>';
  }
  if(type==='多段文本'){
    const body=val?esc(val):'—';
    return '<div class="para'+(showTitle?'':' notitle')+'">'+
      (showTitle?'<div class="pk">'+esc(name)+'</div>':'')+
      '<div class="pv'+(val?'':' empty')+'">'+body+'</div></div>';
  }
  return null; // 文本 → 交给 dl 汇总
}

function renderSections(){
  const host=document.getElementById('secs'); const toc=[];
  host.innerHTML=CASE.sections.map((s,si)=>{
    toc.push(s.n);
    let html='', buf=[];
    const flush=()=>{ if(buf.length){ html+='<div class="dl">'+buf.join('')+'</div>'; buf=[] } };
    s.items.forEach(it=>{
      const [name,type,,val]=it;
      if(type==='文本'){
        const has=!(val===undefined||val===null||val===''||val==='—');
        buf.push('<div class="d"><div class="k">'+esc(name)+'</div>'+
                 '<div class="v'+(has?'':' empty')+'">'+(has?esc(val):'—')+'</div></div>');
      }else{ flush(); html+=renderItem(it); }
    });
    flush();
    return '<div class="card" id="sec'+si+'"><div class="card-hd"><span class="bar"></span><span class="n">'+esc(s.n)+'</span></div>'+
           '<div class="card-bd">'+html+'</div></div>';
  }).join('');
  document.getElementById('sToc').innerHTML=toc.map((n,i)=>
    '<a onclick="jump('+i+')">'+esc(n)+'</a>').join('');
}
function jump(i){
  const el=document.getElementById('sec'+i);
  el.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.toc a').forEach((a,j)=>a.classList.toggle('on',j===i));
}

function renderHead(){
  document.getElementById('hTtl').textContent=CASE.title;
  document.getElementById('hMeta').innerHTML=
    '<span class="pill p-scene">'+esc(CASE.scene)+'</span>'+
    '<span class="pill '+(CASE.status==='已发布'?'p-on':'p-off')+'">'+esc(CASE.status)+'</span>'+
    '<span style="font-size:12.5px;color:var(--text3)">产品：'+esc(CASE.product)+'</span>';
  document.getElementById('sInfo').innerHTML=CASE.info.map(r=>
    '<div class="si"><div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div></div>').join('');
}

/* ── 图片灯箱 ── */
let lbArr=[],lbI=0;
function allImgs(){const a=[];CASE.sections.forEach(s=>s.items.forEach(it=>{if(it[1]==='图片'&&Array.isArray(it[3]))a.push(...it[3])}));return a}
function openLb(i){lbArr=allImgs();lbI=i;document.getElementById('lbTxt').textContent=lbArr[i]||'';document.getElementById('lbox').classList.add('show')}
function closeLb(){document.getElementById('lbox').classList.remove('show')}
function stepLb(d){if(!lbArr.length)return;lbI=(lbI+d+lbArr.length)%lbArr.length;document.getElementById('lbTxt').textContent=lbArr[lbI]}

renderHead();renderSections();
document.querySelector('.toc a')&&document.querySelector('.toc a').classList.add('on');
</script></body></html>
