<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海外市场分析-进出口查询</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#f0efe9;--border:#e2e0da;--border2:#c8c6bc;
  --text:#1a1a18;--text2:#6b6960;--text3:#9c9a90;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue2:#7FAFD9;--teal:#0F6E56;--teal-bg:#E1F5EE;
  --amber:#8A5A0B;--amber-bg:#FAEEDA;--red:#A32D2D;--red-bg:#FCEBEB;--violet:#5B3FA0;--violet-bg:#EEE9F8;
}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
.app{width:1660px;min-height:990px;background:var(--bg2);position:relative;padding-bottom:24px}
.muted{color:var(--text3)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:12.5px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{opacity:.9}
.btn.sm{padding:4px 10px;font-size:12px}
.link{color:var(--blue);cursor:pointer;white-space:nowrap}
.link:hover{text-decoration:underline}

/* header */
.hd{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--bg);border-bottom:1px solid var(--border)}
.hd h1{font-size:16px;font-weight:600}
.hd .sub{font-size:12px;color:var(--text3)}

/* query card */
.qcard{margin:16px 22px 0;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 20px 14px}
.qrow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qrow:last-child{margin-bottom:0}
.ql{width:72px;flex-shrink:0;font-size:12.5px;color:var(--text2);text-align:right}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
.seg span{padding:6px 16px;font-size:12.5px;cursor:pointer;color:var(--text2);border-right:1px solid var(--border2);background:var(--bg)}
.seg span:last-child{border-right:none}
.seg span.on{background:var(--blue);color:#fff}
.seg.sm span{padding:4px 12px;font-size:12px}
.cobar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 12px;margin-bottom:14px;background:var(--bg2,#f6f7f9);border:1px solid var(--border);border-radius:8px}.cobar .sel,.cobar .inp{height:28px;font-size:12px;padding:0 6px}.cobar .hint{margin-left:6px}.cobar .hint:first-child{margin-left:0}.cobar .cokw{display:inline-flex;align-items:center;height:28px;min-width:120px;max-width:220px;padding:0 8px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden}.cobar .cox{cursor:pointer;color:var(--text3,#999);font-size:11px;margin-left:-4px}.cobar .btn.sm{height:28px}.cobar .cotag{width:420px;min-height:28px;padding:1px 6px}.cobar .cotag input{height:22px;font-size:12px;min-width:120px}.cobar .ac{position:relative}.cobar .br{flex-basis:100%;height:0}.cobar .br+.hint{margin-left:0}
.inp,.sel{height:32px;padding:0 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);font-family:inherit;font-size:12.5px;color:var(--text);outline:none}
.inp:focus,.sel:focus{border-color:var(--blue)}
.kw{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 7px;margin:0 3px 0 0;font-size:11.5px;color:var(--text)}
.hint{font-size:11.5px;color:var(--text3)}
.khint{color:var(--amber);font-size:12px;margin-top:-6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* tag input */
.tagin{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:32px;padding:3px 6px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);cursor:text}
.tagin:focus-within{border-color:var(--blue)}
.tagin input{border:none;outline:none;font-family:inherit;font-size:12.5px;flex:1;min-width:140px;height:24px;background:transparent}
.tg{display:inline-flex;align-items:center;gap:2px;background:var(--blue-bg);color:var(--blue);border-radius:5px;padding:2px 3px 2px 8px;font-size:12px;white-space:nowrap}
.tg.jd{background:var(--amber-bg);color:var(--amber)}
.tg b{cursor:pointer;font-weight:400;padding:0 4px;opacity:.7}
.tg b:hover{opacity:1}
.ac{position:relative}
.sug,.pop{position:absolute;top:calc(100% + 4px);left:0;width:440px;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;display:none;padding:4px 0}
.sug div,.pop .it{display:flex;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;font-size:12.5px}
.sug div:hover,.pop .it:hover{background:var(--bg2)}
.sug div.sub{padding-left:28px;color:var(--text2)}
.sug .sfoot,.pop .pfoot{color:var(--text3);font-size:11.5px;cursor:default;border-top:1px solid var(--border);margin-top:4px;padding:8px 12px;display:flex;gap:8px}
.sug .sfoot:hover{background:none}
.pop .it .d{font-size:11.5px;color:var(--text3)}
.pop .it .del{margin-left:auto;color:var(--text3);font-size:12px;white-space:nowrap}.pop .it .del:hover{color:#C0392B}
.pop.right{left:auto;right:0}

/* summary + tabs */
.scope{margin:14px 22px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.scope .tag{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 9px;color:var(--text);max-width:460px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{margin:12px 22px 0;display:flex;gap:4px;border-bottom:1px solid var(--border)}
.tab{padding:9px 18px;font-size:13.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}
.tab .n{font-size:11px;color:var(--text3);margin-left:4px;font-weight:400}
.pane{margin:14px 22px 0}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.kpi .n{font-size:21px;font-weight:600}
.kpi .n small{font-size:12px;font-weight:400;color:var(--text3);margin-left:3px}
.kpi .l{font-size:11.5px;color:var(--text3);margin-top:3px}
.kpi .d{font-size:11.5px;margin-top:4px}
.up{color:var(--teal)}.down{color:var(--red)}
.hi{color:var(--amber);font-weight:500}.lo{color:var(--teal);font-weight:500}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid2 .card{display:flex;flex-direction:column}
.card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.grid2 .card{margin-bottom:0}
.grid2+.card{margin-top:0}
.card h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:28px}
.card h3 .sub{font-size:11.5px;font-weight:400;color:var(--text3)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.clist{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.hbar{display:flex;align-items:center;gap:12px;font-size:12.5px;height:26px}
.hbar .rk{width:20px;height:20px;border-radius:5px;background:var(--bg3);color:var(--text2);font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hbar .rk.top{background:var(--blue-bg);color:var(--blue);font-weight:600}
.hbar .nm{width:96px;flex-shrink:0;display:flex;align-items:center;gap:4px;white-space:nowrap}
.clist.wide .hbar .nm{width:300px;overflow:hidden}.clist.wide .hbar .nm .link{overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;display:flex}
.hbar .tr span{height:100%;border-radius:5px}
.hbar .v{width:96px;text-align:right;color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums}
.hbar .pc{width:48px;text-align:right;color:var(--text3);font-size:12px;font-variant-numeric:tabular-nums}
.chartbox{flex:1;min-height:300px}
.bcol .bg{transition:opacity .15s}.bcol:hover .bg{opacity:.05}.bcol:hover .bar{fill:url(#gBarH)}

/* tables */
.tblwrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.t thead th{background:var(--bg2);color:var(--text2);font-weight:600;font-size:11.5px;position:sticky;top:0}
table.t th.sort{cursor:pointer}
table.t th.sort:after{content:' ⇅';color:var(--text3)}
table.t th.sort.on:after{content:' ↓';color:var(--blue)}
table.t th.sort.on.asc:after{content:' ↑'}
table.t tbody tr:hover{background:var(--bg2)}
table.t tr:last-child td{border-bottom:none}
.num{text-align:right!important}
.wrap{white-space:normal!important;max-width:300px;line-height:1.5}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap}
.p-th{background:var(--teal-bg);color:var(--teal)}
.p-jd{background:var(--amber-bg);color:var(--amber)}
.p-qz{background:var(--blue-bg);color:var(--blue)}
.p-vi{background:var(--violet-bg);color:var(--violet)}
.p-ot{background:var(--bg3);color:var(--text2)}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tbar .sel{height:30px}
.pager{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px}
.pg{min-width:28px;height:28px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:6px;background:var(--bg);cursor:pointer}
.pg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg.dis{color:var(--text3);cursor:default;background:var(--bg2)}
.share{display:inline-block;width:56px;height:6px;background:var(--bg3);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--teal)}
/* pivot */
.pvwrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table.pv th,table.pv td{padding:9px 12px}
table.pv td:first-child,table.pv th:first-child{position:sticky;left:0;z-index:1;background:var(--bg);min-width:210px;border-right:1px solid var(--border)}
table.pv thead th:first-child{background:var(--bg2);z-index:2}
table.pv tr.tot td{background:var(--bg2);font-weight:600}
table.pv tr.diff td{background:#fffdf8}
table.pv td.c-last,table.pv th.c-last{border-left:1px solid var(--border);background:#fbfaf7}
table.pv tr.mu td{color:var(--text3)}

/* 选择弹窗 */
.mdl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:940px;max-height:86vh;background:var(--bg);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.mdl .mbd{flex:1;min-height:0;display:flex;overflow:hidden}
.mdl .mft{display:flex;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid var(--border)}
.mdl .tool{display:flex;align-items:center;gap:8px;padding:12px 22px 8px}
.mdl .chips span{display:inline-block;padding:3px 10px;border:1px solid var(--border2);border-radius:12px;font-size:12px;cursor:pointer;margin-right:4px}
.mdl .chips span.on{background:var(--blue);border-color:var(--blue);color:#fff}
.plist{width:250px;border-right:1px solid var(--border);overflow-y:auto;padding:6px 0}
.plist .pi{padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12.5px}
.plist .pi:hover{background:var(--bg2)}.plist .pi.on{background:var(--blue-bg)}
.plist .pi .c{color:var(--text3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.plist .pi .bd{background:var(--blue);color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
.pright{flex:1;overflow-y:auto;padding:14px 22px}
.ck{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12.5px;cursor:pointer}
.ck:hover{background:var(--bg2)}
.ck input{margin:0}
.ck .sp{flex:1}
.selbar{display:flex;flex-wrap:wrap;gap:4px;flex:1;max-height:60px;overflow-y:auto;font-size:12px;padding:2px 0}

/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(20,25,35,.45);display:none;z-index:60}
.ov.show{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:1040px;background:var(--bg);display:flex;flex-direction:column}
.drawer.narrow{width:560px}
.dhd{display:flex;align-items:center;gap:10px;padding:15px 22px;border-bottom:1px solid var(--border)}
.dhd h3{font-size:15px;font-weight:600}
.mx{cursor:pointer;color:var(--text2);width:28px;height:28px;border:1px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-left:auto}
.dbody{flex:1;overflow-y:auto;padding:16px 22px}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 20px;font-size:12.5px;margin-bottom:14px}
.info dt{color:var(--text3);font-size:11.5px}
.info dd{margin-top:2px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.mini .kpi{padding:10px 14px}
.mini .kpi .n{font-size:17px}
.sect{font-size:13px;font-weight:600;margin:16px 0 8px;display:flex;align-items:center;gap:10px}
.sect .sub{font-size:11.5px;font-weight:400;color:var(--text3)}
.dl{display:grid;grid-template-columns:110px 1fr 110px 1fr;row-gap:10px;column-gap:12px;font-size:12.5px}
.dl dt{color:var(--text3)}
.cov{position:absolute;top:52px;right:22px;width:640px;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:14px 16px;display:none;z-index:40;font-size:12.5px;line-height:1.8;color:var(--text2)}
.cov.show{display:block}
.cov b{color:var(--text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 18px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.empty{padding:50px 0;text-align:center;color:var(--text3)}
.qi{cursor:help;color:var(--text3);margin-left:2px}
/* 国家级联选择（与平台现有样式一致） */
.casc{position:relative}
.casc .box{height:32px;width:170px;padding:0 28px 0 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);display:flex;align-items:center;font-size:12.5px;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.casc .box:after{content:'';position:absolute;right:11px;top:12px;width:6px;height:6px;border-right:1.5px solid var(--text3);border-bottom:1.5px solid var(--text3);transform:rotate(45deg)}
.casc.open .box{border-color:var(--blue)}
.casc.open .box:after{transform:rotate(-135deg);top:15px}
.cpanel{position:absolute;top:calc(100% + 4px);left:0;display:none;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:35}
.casc.open .cpanel{display:flex}
.ccol{width:168px;max-height:260px;overflow-y:auto;padding:4px 0}
.ccol+.ccol{border-left:1px solid var(--border)}
.ccol div{display:flex;align-items:center;padding:8px 14px;font-size:12.5px;cursor:pointer;color:var(--text)}
.ccol div:hover{background:var(--bg2)}
.ccol div.on{color:var(--blue);font-weight:500}
.ccol div .ar{margin-left:auto;color:var(--text3)}
.ccol div.on .ar{color:var(--blue)}
.ccol div .ck{width:16px;color:var(--blue)}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <h1>海外市场分析</h1>
    <span class="sub">基于海关进出口数据，按产品品名、HS编码或企业查询进出口流向、海外买家与出口竞争格局</span>
    <span class="sp"></span>
    <span class="hint">数据更新至 2026-10</span>
    <span class="link" onclick="openMk()">客户标记管理</span>
  </div>

  <!-- 查询区 -->
  <div class="qcard">
    <div class="qrow">
      <span class="ql">贸易方向</span>
      <div class="seg" id="segDir"><span data-v="EX" class="on">出口（中国 → 海外）</span><span data-v="IM">进口（海外 → 中国）</span></div>
      <span class="hint" style="margin-left:12px">以下条件均可单独使用，也可组合查询</span>
      <span class="sp"></span>
      <div class="ac"><button class="btn sm" onclick="togglePop(event,'qsPop')">常用查询 ▾</button><div class="pop right" id="qsPop" style="width:400px"></div></div>
      <div class="ac"><span class="link" onclick="togglePop(event,'savePop')">保存当前条件</span>
        <div class="pop right" id="savePop" style="width:340px;padding:12px 14px">
          <div style="font-size:12.5px;margin-bottom:8px">保存为常用查询，下次一键调用</div>
          <input class="inp" id="saveName" style="width:100%" placeholder="如：印度 PBAT 纯料客户开发">
          <div style="display:flex;gap:8px;margin-top:10px"><span class="sp"></span><button class="btn sm" onclick="closePops()">取消</button><button class="btn sm pri" onclick="saveQuery()">保存</button></div>
        </div></div>
    </div>
    <div class="qrow">
      <span class="ql">产品/品名</span>
      <div class="ac"><div class="tagin" style="width:600px" onclick="$('kwIn').focus()"><span id="kwTags" style="display:contents"></span><input id="kwIn" placeholder="输入产品或品名写法，回车添加，如 PBAT、PBAT chips" autocomplete="off" oninput="showKwSug()" onfocus="showKwSug()" onblur="setTimeout(()=>$('kwSug').style.display='none',150)" onkeydown="tagKey(event,'kw')"></div>
        <div class="sug" id="kwSug" style="width:520px"></div></div>
      <button class="btn sm" style="height:32px" onclick="openKwPick()">选择产品</button>
      <span class="ql">HS编码</span>
      <input class="inp" id="hs" style="width:170px" placeholder="建议填前6位，如 390799" onkeydown="if(event.key==='Enter')runQuery()">
      <span class="link" onclick="toast('打开HS编码助手：输入中英文关键词查编码，同一编码只显示一行，选中后带回')">HS编码助手</span>
    </div>
    <div class="qrow" id="kwHintRow" style="display:none"><span class="ql"></span><div class="khint" id="kwHint"></div></div>
    <div class="qrow">
      <span class="ql" id="cnLab">中国出口商</span>
      <div class="ac"><div class="tagin" style="width:600px" onclick="$('cnIn').focus()"><span id="cnTags" style="display:contents"></span><input id="cnIn" placeholder="输入企业名称，回车添加，可添加多家" autocomplete="off" oninput="showCnSug()" onfocus="showCnSug()" onblur="setTimeout(()=>$('cnSug').style.display='none',150)" onkeydown="tagKey(event,'cn')"></div>
        <div class="sug" id="cnSug"></div></div>
      <div class="ac"><button class="btn sm" id="compBtn" style="height:32px" onclick="openCoPick()">选择企业</button><div class="pop" id="compPop" style="width:460px"></div></div>
      <span class="ql" id="osLab">海外买家</span>
      <div class="ac"><div class="tagin" style="width:300px" onclick="$('osIn').focus()"><span id="osTags" style="display:contents"></span><input id="osIn" placeholder="输入企业名称，回车添加，可添加多家" autocomplete="off" oninput="showOsSug()" onfocus="showOsSug()" onblur="setTimeout(()=>$('osSug').style.display='none',150)" onkeydown="tagKey(event,'os')"></div>
        <div class="sug" id="osSug" style="width:420px"></div></div>
      <span class="ql" id="ctyLab" style="width:52px">目的国</span>
      <div class="casc" id="casc"><div class="box" id="cascBox" onclick="toggleCasc(event)">全部</div><div class="cpanel" id="cpanel"></div></div>
    </div>
    <div class="qrow">
      <span class="ql">时间</span>
      <div class="seg" id="segTime"><span data-v="y" class="on">按年</span><span data-v="m">按月</span></div>

const splitKw=v=>v.split(/[,，]/).map(s=>s.trim().toLowerCase()).filter(Boolean);
function cnMatch(r,tags){return !tags.length||tags.some(t=>t.includes('屯河')?r.cnTag==='th':r.cn.toLowerCase().includes(t.toLowerCase()))}
function filt(ms,opt){
  opt=opt||{};const set=new Set(ms);const kw=(opt.kw!==undefined?opt.kw:S.kw).map(s=>s.toLowerCase());const hs=(opt.hs!==undefined?opt.hs:$('hs').value).replace(/\D/g,'');
  const cn=opt.cn!==undefined?opt.cn:S.cn,os=S.os.map(x=>x.toLowerCase()),cty=S.cty;
  const pmin=parseFloat($('pmin').value),pmax=parseFloat($('pmax').value);const usePr=!isNaN(pmin)||!isNaN(pmax);
  return REC.filter(r=>r.dir===S.dir&&set.has(r.mon)&&(!cty||r.cty===cty)&&(!hs||r.hs.startsWith(hs))
    &&(!kw.length||kw.some(k=>(r.desc+' '+r.sx).toLowerCase().includes(k)))
    &&cnMatch(r,cn)&&(!os.length||os.some(o=>r.os.toLowerCase().includes(o)))
    &&(!usePr||(r.qty&&(isNaN(pmin)||r.amt/r.qty>=pmin)&&(isNaN(pmax)||r.amt/r.qty<=pmax))));
}

  if(d){

function agg(list,key){const m=new Map();list.forEach(r=>{const k=r[key];if(!m.has(k))m.set(k,{k,amt:0,qty:0,amtQ:0,qTh:0,n:0,last:'',parts:new Map(),ctys:new Map(),descs:new Map(),tag:r.cnTag,cty:r.cty});const o=m.get(k);o.amt+=r.amt;o.qty+=(r.qty||0);if(r.qty)o.amtQ+=r.amt;if(r.qty&&r.cnTag==='th')o.qTh+=r.qty;if(r.cnTag==='th')o.hasTh=true;o.n++;if(r.date>o.last)o.last=r.date;const pk=key==='os'?r.cn:r.os;if(pk)o.parts.set(pk,(o.parts.get(pk)||0)+(r.qty||0));o.ctys.set(r.cty,(o.ctys.get(r.cty)||0)+r.amt);const dk=r.desc.replace(/\s+(TH801T|A-200F|B1100|C-08)$/,'');o.descs.set(dk,(o.descs.get(dk)||0)+1)});
  return [...m.values()].map(o=>(o.thShare=o.qty?o.qTh/o.qty:null,o))}

function niceMax(v,n){const raw=v/n;const mag=Math.pow(10,Math.floor(Math.log10(raw||1)));const f=raw/mag;const st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;return [st*n,st]}
function barChart(series,w,h){ // series:[{m,amt,price}]
  const pad={l:52,r:48,t:30,b:28};const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;const n=series.length;
  const [maxA]=niceMax(Math.max(...series.map(s=>s.amt/10000),1)*1.05,4);const [maxP]=niceMax(Math.max(...series.map(s=>s.price||0),0.1)*1.15,4);
  const bw=Math.max(8,Math.min(iw/n*0.36,24));const r=Math.min(4,bw/2);
  let svg=`<svg width="${w}" height="${h}" style="display:block;overflow:visible"><defs><linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F7FC4"/><stop offset="1" stop-color="#9CC3E8"/></linearGradient><linearGradient id="gBarH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#185FA5"/><stop offset="1" stop-color="#6FA6DA"/></linearGradient></defs>`;
  for(let i=0;i<=4;i++){const y=pad.t+ih*i/4;svg+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="${i===4?'#d9d6cd':'#efede7'}" ${i===4?'':'stroke-dasharray="3 3"'}/><text x="${pad.l-10}" y="${y+4}" font-size="10.5" fill="#9c9a90" text-anchor="end">${fmtN(+(maxA*(1-i/4)).toFixed(1))}</text><text x="${w-pad.r+10}" y="${y+4}" font-size="10.5" fill="#9c9a90">${(maxP*(1-i/4)).toFixed(2)}</text>`}
  let pts=[];const step=Math.ceil(n/12);
  series.forEach((s,i)=>{const slot=iw/n;const cx=pad.l+slot*(i+0.5);const bh=ih*(s.amt/10000)/maxA;const x=cx-bw/2,y=pad.t+ih-bh;
    const tip=`${s.m}　金额 ${fmtW(s.amt)} 万美元${s.price?'　均价 '+s.price.toFixed(2)+' USD/kg':''}`;
    svg+=`<g class="bcol"><rect x="${cx-slot/2+2}" y="${pad.t}" width="${slot-4}" height="${ih}" fill="#185FA5" opacity="0" class="bg"/>`;
    if(bh>0){const rr=Math.min(r,bh);const lt=false;svg+=`<path class="bar" d="M${x},${y+bh} V${y+rr} Q${x},${y} ${x+rr},${y} H${x+bw-rr} Q${x+bw},${y} ${x+bw},${y+rr} V${y+bh} Z" fill="${lt?'#DCE8F5':'url(#gBar)'}" ${lt?'stroke="#7FA9D6" stroke-dasharray="3 2"':''}/>`;if(lt)svg+=`<text x="${cx}" y="${y-6}" font-size="10.5" fill="#9c9a90" text-anchor="middle">未到齐</text>`}
    svg+=`<title>${tip}</title></g>`;
    if(i%step===0)svg+=`<text x="${cx}" y="${h-8}" font-size="10.5" fill="#6b6960" text-anchor="middle">${s.m.slice(2)}</text>`;
    if(s.price)pts.push([cx,pad.t+ih-ih*s.price/maxP,s,i])});
  if(pts.length>1){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const p0=pts[i-1],p1=pts[i];if(p1[3]-p0[3]>1){d+=` M${p1[0]},${p1[1]}`;continue}const mx=(p0[0]+p1[0])/2;d+=` C${mx},${p0[1]} ${mx},${p1[1]} ${p1[0]},${p1[1]}`}svg+=`<path d="${d}" fill="none" stroke="#C07A12" stroke-width="2" stroke-linecap="round" pointer-events="none"/>`}
  svg+=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#fff" stroke="#C07A12" stroke-width="1.8" pointer-events="none"/>`).join('');
  svg+=`<text x="${pad.l-10}" y="12" font-size="10.5" fill="#9c9a90" text-anchor="end">万美元</text><text x="${w-pad.r+10}" y="12" font-size="10.5" fill="#9c9a90">USD/kg</text></svg>`;return svg;
}
function monthly(list,ms){return (ms||monthsOf()).map(m=>{const x=list.filter(r=>r.mon===m);return{m,amt:sumA(x),qty:sumQ(x),price:price(x)}})}

const PVM=[['qty','数量（吨）'],['share','数量份额'],['price','均价（USD/kg）'],['amt','金额（万美元）']];
const short=n=>n.includes('蓝山屯河')?'蓝山屯河':n.replace(/(新材料|生物科技|化工|生物材料)?(股份)?有限公司$/,'');
function pivot(list,ms,rows,metric,head,diff,den){
  const cols=ms.concat(['合计']);const byM=m=>m==='合计'?list:list.filter(r=>r.mon===m);const byD=m=>!den?byM(m):(m==='合计'?den:den.filter(r=>r.mon===m));
  const cell=(sub,all)=>{if(metric==='qty'){const q=sumQ(sub);return q?fmtT(q):DASH}if(metric==='amt'){const a=sumA(sub);return a?fmtW(a):DASH}
    if(metric==='share'){const t=sumQ(all.__den||all),q=sumQ(sub);return t&&q?(q/t*100).toFixed(1)+'%':DASH}const p=price(sub);return p?p.toFixed(2):DASH};
  let h=`<div class="pvwrap"><table class="t pv"><thead><tr><th>${head}</th>${cols.map(m=>`<th class="num ${m==='合计'?'c-last':''}">${m==='合计'?'整个周期':m}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(rw=>{if(!rw.keep&&!list.some(rw.f))return;h+=`<tr class="${rw.cls||''}"><td>${rw.html||esc(rw.n)}</td>${cols.map(m=>{const all=byM(m);all.__den=byD(m);return `<td class="num ${m==='合计'?'c-last':''}">${cell(all.filter(rw.f),all)}</td>`}).join('')}</tr>`});
  if(metric==='price'&&diff){h+=`<tr class="diff"><td>${diff.label}<span class="qi" title="屯河均价减去${diff.base}的均价；正数表示屯河价格更高">ⓘ</span></td>${cols.map(m=>{const all=byM(m);const a=price(all.filter(diff.th)),b=price(all.filter(diff.ot));if(!a||!b)return `<td class="num ${m==='合计'?'c-last':''}">${DASH}</td>`;const d=a-b;return `<td class="num ${m==='合计'?'c-last':''}"><span class="${d>0?'hi':'lo'}">${d>0?'+':''}${d.toFixed(2)}</span></td>`}).join('')}</tr>`}
  h+=`<tr class="tot"><td>${metric==='price'?'整体均价':'合计'}</td>${cols.map(m=>{const all=byM(m);return `<td class="num ${m==='合计'?'c-last':''}">${metric==='share'?(()=>{const t=sumQ(byD(m)),q=sumQ(all);return t&&q?(q/t*100).toFixed(1)+'%':DASH})():cell(all,all)}</td>`}).join('')}</tr>`;
  return h+'</tbody></table></div>';
}
function compIdx(){

  if(sel.length)return sel;const d=prodOf();if(d)return COMP[d.p]||[];return CN_CO.map((c,i)=>i).filter(i=>CN_CO[i].tag==='jd')}
function ovRows(list,oneBuyer){
  if(S.dir==='EX'){
    const pill=n=>tagCls(n)==='th'?' <span class="pill p-th">屯河</span>':tagCls(n)==='jd'?' <span class="pill p-jd">竞对</span>':'';
    const key=r=>r.cnTag==='th'?'蓝山屯河':r.cn;let rows;
    if(S.cn.length){ // 按所选出口商逐个列出
      rows=S.cn.map(t=>t.includes('屯河')?{n:'蓝山屯河',html:'蓝山屯河'+pill('蓝山屯河'),f:r=>r.cnTag==='th',cls:'th',keep:1}:{n:t,html:esc(short(t))+pill(t),f:r=>r.cnTag!=='th'&&r.cn.toLowerCase().includes(t.toLowerCase()),keep:1});
    }else{ // 未选出口商：按数量列出前 8 家出口商
      const top=agg(list.filter(r=>r.cn&&!r.lgS).map(r=>Object.assign({},r,{cn:key(r)})),'cn').sort((a,b)=>b.qty-a.qty).slice(0,8).map(x=>x.k);
      rows=top.map(n=>({n,html:esc(short(n))+pill(n),f:r=>key(r)===n,cls:n==='蓝山屯河'?'th':''}));
    }
    const named=rows.slice();const inRow=r=>named.some(rw=>rw.f(r));
    rows.push({n:'其他出口商',f:r=>r.cn&&!inRow(r)});rows.push({n:'未披露出口商名称',f:r=>!r.cn,cls:'mu'});
    const hasTh=rows.some(rw=>rw.n==='蓝山屯河'),jd=rows.filter(rw=>tagCls(rw.n)==='jd');
    return {rows,diff:hasTh&&jd.length?{label:'屯河较竞对均价',base:'竞对',th:r=>r.cnTag==='th',ot:r=>jd.some(rw=>rw.f(r))}:null}}
  const top=agg(list.filter(r=>r.os&&!r.lgS),'os').sort((a,b)=>b.amt-a.amt).slice(0,5).map(x=>x.k);const set=new Set(top);
  const rows=top.map(n=>({n,f:r=>r.os===n}));rows.push({n:'其他供应商',f:r=>r.os&&!r.lgS&&!set.has(r.os)});rows.push({n:'未披露供应商名称',f:r=>!r.os,cls:'mu'});return {rows}}

  let rows=seq?PQ(seq).rows:null;if(rows&&c.buyerAll){const al=PQ(c.buyerAll).rows;rows=rows.map(r=>{const a=al.find(x=>x['进口商']===r['进口商']);return a?Object.assign({},r,a):r})}
  if(rows){if(BFILTER==='none')rows=rows.filter(b=>!MARK[b['进口商']]);else if(BFILTER!=='all')rows=rows.filter(b=>MARK[b['进口商']]===BFILTER);if(ex){if(CFILTER==='none')rows=rows.filter(b=>!CAT[b['进口商']]);else if(CFILTER!=='all')rows=rows.filter(b=>CAT[b['进口商']]===CFILTER)}}
  const opt=(v,arr)=>arr.map(x=>`<option value="${x[0]}" ${v===x[0]?'selected':''}>${x[1]}</option>`).join('');const nc=ex?10:9;
  $('pane').innerHTML=`
  <div class="tbar">
    <span class="hint">跟进标记</span><select class="sel" onchange="BFILTER=this.value;S.page.buyer=1;renderPane()">${opt(BFILTER,[['all','全部'],['已合作','已合作'],['跟进中','跟进中'],['暂不跟进','暂不跟进'],['none','无标记']])}</select>
    ${ex?`<span class="hint" style="margin-left:8px">客户类别</span><select class="sel" onchange="CFILTER=this.value;S.page.buyer=1;renderPane()">${opt(CFILTER,[['all','全部'],['纯料客户','纯料客户'],['改性料客户','改性料客户'],['两者都有','纯料+改性料'],['none','无标记']])}</select>`:''}
    <span class="qi" title="跟进标记、客户类别由业务人员手动维护，长期保留，不随查询条件变化" style="margin-left:4px">ⓘ 标记说明</span>
    <span class="sp"></span><span class="hint">共 ${t} 家</span><button class="btn" onclick="toast('已导出${l.buyer}列表（Excel）')">导出Excel</button></div>
  <div class="tblwrap"><table class="t"><thead><tr><th>序号</th><th>${l.buyer}</th><th>所在国家</th><th class="sort num on" onclick="sortBy('buyer','qty')">采购数量（吨）</th><th class="num">均价（USD/kg）</th><th class="sort num" onclick="sortBy('buyer','amt')">采购金额（万美元）</th><th class="sort num" onclick="sortBy('buyer','n')">交易次数</th>${ex?'<th>客户类别</th>':''}<th>跟进标记</th><th>操作</th></tr></thead><tbody>
  ${rows?rows.map((b,i)=>{const k=b['进口商'];const ok=pOk(k);const nm=enc(k||'');const link=ok?`<span class="link" onclick="openCo('${ex?'os':'cn'}',decodeURIComponent('${nm}'))">${esc(k)}</span>`:pNm(k);
    return `<tr><td>${(p-1)*10+i+1}</td><td>${link}</td><td>${ex?'<span class="muted">-</span>':'中国'}</td><td class="num">${fq(pT(b.ton))}</td><td class="num">${fp(b.ton&&b.stats?b.stats/(b.ton*1000):0)}</td><td class="num">${fmtW(b.stats)}</td><td class="num">${b._count}</td>${ex?`<td>${ok?catSel(k,CAT[k]):''}</td>`:''}<td>${ok?markSel(k,MARK[k]):''}</td><td>${ok?`<span class="link" onclick="openCo('${ex?'os':'cn'}',decodeURIComponent('${nm}'))">采购分析</span>`:''}</td></tr>`}).join(''):pMiss(t,nc,sc==='ex'?'前 2 页':'第 1 页')}
  </tbody></table>${rows&&!rows.length?`<div class="empty">本页没有符合筛选的${l.buyer}</div>`:''}</div><div class="pager">${ph}</div>
  ${sc==='cn'?'<div class="hint" style="margin-top:4px">列表为从所选出口商采购过的买家；采购数量、金额按该买家同条件下的全部采购计算，不受出口商条件影响</div>':''}
`;
}
function paneSupP(){
  const sc=pScene(),c=PS[sc],l=L();const ex=S.dir==='EX';const t=PQ(c.sup[0]).t;const [ph,p]=pager('sup',t,10);const seq=c.sup[p-1];const rows=seq?PQ(seq).rows:null;const side=ex?'cn':'os';
  $('pane').innerHTML=`<div class="tbar"><span class="hint">${ex?'企业名称按「竞对企业维护」中维护的海关英文名称归一，未维护的写法单独显示':''}</span><span class="sp"></span><button class="btn" onclick="toast('已导出${l.sup}列表（Excel）')">导出Excel</button></div>
  <div class="tblwrap"><table class="t"><thead><tr><th>排名</th><th>${l.sup}</th>${ex?'<th>标签</th>':'<th>所在国家</th>'}<th class="sort num on" onclick="sortBy('sup','qty')">数量（吨）</th><th class="num">均价（USD/kg）</th><th class="sort num" onclick="sortBy('sup','amt')">金额（万美元）</th><th class="sort num" onclick="sortBy('sup','n')">交易次数</th><th>操作</th></tr></thead><tbody>
  ${rows?rows.map((s,i)=>{const k=s['出口商'];const ok=pOk(k);const co=ok?pCo(k):{jd:0};const nm=enc(k||'');
    return `<tr><td>${(p-1)*10+i+1}</td><td>${ok?`<span class="link" onclick="openCo('${side}',decodeURIComponent('${nm}'))">${esc(k)}</span>`:pNm(k)}</td><td>${ex?(ok?tagPill(co.jd?'jd':'ot','cn'):'<span class="muted">-</span>'):'<span class="muted">-</span>'}</td><td class="num">${fq(pT(s.ton))}</td><td class="num">${fp(s.ton&&s.stats?s.stats/(s.ton*1000):0)}</td><td class="num">${fmtW(s.stats)}</td><td class="num">${s._count}</td><td>${ok?`<span class="link" onclick="openCo('${side}',decodeURIComponent('${nm}'))">详情</span>`:''}</td></tr>`}).join(''):pMiss(t,8,sc==='ex'?'前 2 页':'第 1 页')}
  </tbody></table></div><div class="pager">${ph}</div>
`;
}
function paneRecP(){
  const sc=pScene(),c=PS[sc],l=L();const ex=S.dir==='EX';const t=PQ(c.list[0]).t;const [ph,p]=pager('rec',t,10);const seq=c.list[p-1];const rows=seq?PQ(seq).rows:null;const ck=ex?'进口商所在国家':'出口商所在国家';
  $('pane').innerHTML=`<div class="tbar"><input class="inp" style="width:260px" placeholder="在结果中搜索企业名称或品名，回车确认" ><span class="sp"></span><button class="btn" onclick="toast('已导出交易明细（Excel），单次最多导出5000条')">导出Excel</button></div>
  <div class="tblwrap"><table class="t"><thead><tr><th class="sort on" onclick="sortBy('rec','date')">日期</th><th>数据类型</th><th>${ex?'中国出口商':'海外供应商'}</th><th>${ex?'海外买家':'中国进口商'}</th><th>${l.cty}</th><th>HS编码</th><th>品名描述</th><th class="sort num" onclick="sortBy('rec','qty')">数量（吨）</th><th class="num">单价（USD/kg）</th><th class="sort num" onclick="sortBy('rec','amt')">金额（美元）</th><th>操作</th></tr></thead><tbody>
  ${rows?rows.map((r,i)=>`<tr><td>${r['日期']}</td><td>明细</td><td>${r['出口商']?esc(r['出口商']):NA}</td><td>${r['进口商']?esc(r['进口商']):NA}</td><td>${esc(pCty(r[ck]))}</td><td>390770</td><td class="wrap" title="${esc(r['详细产品名称'])}">${esc(clip(r['详细产品名称'],40))}</td><td class="num">${pQ(r['公吨'])}</td><td class="num">${fp(r['公吨']&&r['金额美元']?r['金额美元']/(r['公吨']*1000):0)}</td><td class="num">${r['金额美元']?fmtN(r['金额美元']):DASH}</td><td><span class="link" onclick="openRecP(${seq},${i})">查看</span></td></tr>`).join(''):pMiss(t,11,sc==='ex'?'前 2 页':'第 1 页')}
  </tbody></table></div><div class="pager">${ph}</div>`;
}
let PCO=null;
function openCoP(side,name,mode){
  if(mode!=='keep'||!CO_F){CO_F=coPageF();CO_D=coClone(CO_F)}CO_ARGS=[side,name,S.dir];PCO=[side,name];const ex=S.dir==='EX',isOs=side==='os',buyerView=ex&&isOs;const m=PLA_COD[name];
  const roleT=ex?(isOs?'海外买家':'中国出口商'):(isOs?'海外供应商':'中国进口商'),partT=ex?(isOs?'出口商':'海外买家'):(isOs?'中国进口商':'海外供应商');
  const mk=buyerView||(!ex&&!isOs);const typeHtml=buyerView?(MARK[name]?MK[MARK[name]]:'')+(CAT[name]?CK[CAT[name]]:''):(!isOs&&ex?tagPill(pCo(name).jd?'jd':'ot','cn'):'');
  const cond=coBar(S.dir,false,isOs);
  const info=`<dl class="info"><div><dt>所在国家</dt><dd>${isOs?'-':'中国'}</dd></div><div><dt>主要港口</dt><dd>-</dd></div>${(ex?isOs:!isOs)?'':'<div><dt>联系方式</dt><dd>-</dd></div>'}${buyerView?`<div><dt>客户类别</dt><dd>${catSel(name,CAT[name])}</dd></div>`:''}${mk?`<div><dt>跟进标记</dt><dd>${markSel(name,MARK[name])}</dd></div>`:''}</dl>`;
  let body;
  if(!m||m.dir!==S.dir){body=`<div class="card" style="margin-top:14px"><div class="empty" style="padding:36px 0">暂无数据</div></div>`}
  else{const K=PQ(m.kpi,1).rows[0];const tot=pMon(PQ(m.kpi).rows);const pf=m.pf||'出口商';const parts=PQ(m.parts);const pvAll=PQ(m.pv).rows;const rows=pRows(pvAll,pf,ex&&pf==='出口商');{const un=pMon(pvAll.filter(r=>!pOk(r[pf])));const oth=pSub(tot,rows.map(r=>r.d).concat([un]));rows.push({n:'其他'+partT,d:oth});rows.push({n:'未披露名称',d:un,cls:'mu'})}const recs=PQ(m.rec).rows;const pr=K.ton_all&&K.amount_all?K.amount_all/(K.ton_all*1000):0;const nco=new Set(parts.rows.filter(r=>pOk(r[pf])).map(r=>pCo(r[pf]).n)).size;
    body=`<div class="mini">
      <div class="kpi"><div class="n">${fmtT(pT(K.ton_all))}<small>吨</small></div><div class="l">${buyerView?'采购数量':'交易数量'}</div></div>
      <div class="kpi"><div class="n">${pr?pr.toFixed(2):'—'}<small>USD/kg</small></div><div class="l">平均单价</div></div>
      <div class="kpi"><div class="n">${fmtW(K.amount_all)}<small>万美元</small></div><div class="l">交易金额</div></div>
      ${buyerView?`<div class="kpi"><div class="n">0.0<small>%</small></div><div class="l">屯河份额（按数量）</div></div>`:`<div class="kpi"><div class="n">${nco}<small>家</small></div><div class="l">${partT}</div></div>`}
    </div>
    <div class="sect">${buyerView?'按月采购构成':'按月交易构成'}<span class="sub">${buyerView?'每月从谁家买、买多少、什么价格':'按'+partT+'拆分'}</span><span class="sp"></span>${pvSeg('pvd','plaCoRe()')}</div>
    ${pPivot(rows,tot,tot,S.pvd,partT)}
    <div class="sect">最近交易记录<span class="sub">共 ${fmtN(PQ(m.rec).t)} 条</span></div>
    <div class="tblwrap"><table class="t"><thead><tr><th>日期</th><th>${partT}</th><th>品名描述</th><th class="num">数量（吨）</th><th class="num">单价（USD/kg）</th><th class="num">金额（美元）</th><th>操作</th></tr></thead><tbody>
    ${recs.map((r,i)=>`<tr><td>${r['日期']}</td><td>${r[pf]?esc(r[pf]):NA}</td><td class="wrap" title="${esc(r['详细产品名称'])}">${esc(clip(r['详细产品名称'],40))}</td><td class="num">${pQ(r['公吨'])}</td><td class="num">${fp(r['公吨']&&r['金额美元']?r['金额美元']/(r['公吨']*1000):0)}</td><td class="num">${r['金额美元']?fmtN(r['金额美元']):DASH}</td><td><span class="link" onclick="openRecP('${m.rec}',${i})">查看</span></td></tr>`).join('')}
    </tbody></table></div>`}
  $('coDrawer').innerHTML=`<div class="dhd"><h3>${esc(name)}</h3>${typeHtml}<span class="muted" style="font-size:12px">${roleT}</span><div class="mx" onclick="closeOv('coOv')">✕</div></div>
  <div class="dbody">${cond}${info}${body}</div>
  <div style="padding:12px 22px;border-top:1px solid var(--border);display:flex;gap:8px"><span class="sp"></span><button class="btn" onclick="toast('已导出该企业交易记录及按月构成')">导出Excel</button></div>`;
  $('coOv').classList.add('show');
}
function plaCoRe(){if(PCO)openCoP(PCO[0],PCO[1],'keep')}
function openRecP(seq,i){
  const r=PQ(seq).rows[i];const ex=S.dir==='EX';const x='<span class="muted">-</span>';const f=(k,v)=>`<dt>${k}</dt><dd>${v===undefined||v===''||v===null?x:esc(v)}</dd>`;const ck=ex?'进口商所在国家':'出口商所在国家';
  $('recDrawer').innerHTML=`<div class="dhd"><h3>海关明细</h3><span class="muted" style="font-size:12px">数据来源：海关数据</span><div class="mx" onclick="closeOv('recOv')">✕</div></div>
  <div class="dbody"><dl class="dl">
    ${f('海关编码','390770')}${f('日期',r['日期'])}${f('详细产品名称',r['详细产品名称'])}
    ${f('数量',r['公吨']>0?(r['公吨']*1000).toLocaleString('zh-CN')+' KG':'')}${f('金额',r['金额美元']?fmtN(r['金额美元'])+' 美元':'')}${f('单价',r['公吨']>0&&r['金额美元']?(r['金额美元']/(r['公吨']*1000)).toFixed(2)+' USD/kg':'')}
    ${f(ex?'进口商（买家）':'进口商（中国企业）',r['进口商'])}${ex&&r[ck]?f('进口商所在国家',pCty(r[ck])):''}
    ${f(ex?'出口商':'出口商（海外供应商）',r['出口商'])}${!ex&&r[ck]?f('出口商所在国家',pCty(r[ck])):''}
  </dl><div class="hint" style="margin-top:16px;line-height:1.7">以上为海关数据接口原始返回（品名较长的做了节选）；数据源未提供的字段显示"-"。</div></div>`;
  $('recOv').classList.add('show');
}

renderLabels();S.kw=PBAT_KW.slice();renderTags('kw');renderTags('cn');runQuery();
</script>
